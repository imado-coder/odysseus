<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101418">

<!-- Installable on a phone's home screen. The merchant works this list all
     day, standing up, and a tab among twenty tabs is not that. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MITOS">
<meta name="mobile-web-app-capable" content="yes">

<title>MITOS — Commandes</title>
<!--
  The merchant's call list, and the shipping table behind it.

  A cash-on-delivery merchant's day is a call list: ring the customer,
  confirm, hand to the courier. They do it from a phone, standing up. So this
  is one screen, one column, and every control is a thumb-sized target.

  It is a static file on purpose. It holds no secret, talks to no database,
  and needs no environment: the merchant's key lives in their own browser and
  is sent as a bearer header to the Supabase function that owns the data.
  That is why it could be deployed without anyone pasting credentials
  anywhere — which is the only reason this exists rather than the embedded
  Shopify screen in app/routes/app._index.tsx.
-->
<style>
  :root{
    --ink:#101418; --sub:#5c6672; --line:#e7eaec; --bg:#f4f5f6; --card:#fff;
    --ok:#0a8800; --bad:#d72c0d; --warn:#a35b00; --info:#1a56b3;
  }
  @media (prefers-color-scheme: dark){
    :root{--ink:#e9edf1;--sub:#9aa5b1;--line:#2a3138;--bg:#14181c;--card:#1b2126}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:var(--card);
    border-bottom:1px solid var(--line);padding:.75rem 1rem .5rem;
    padding-top:max(.75rem,env(safe-area-inset-top))}
  .bar__row{display:flex;align-items:baseline;justify-content:space-between;
    gap:.5rem;margin-bottom:.5rem}
  h1{margin:0;font-size:1.0625rem;letter-spacing:-.01em}
  /* The domain gives way first: it is the least useful thing on the row, and
     without min-width:0 a nowrap flex item refuses to shrink and shoves the
     language button off the screen instead. */
  .shop{flex:1 1 auto;min-width:0;font-size:.8125rem;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:end}
  .chips{display:flex;gap:.375rem;overflow-x:auto;padding-bottom:.25rem;
    scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:.375rem;
    min-height:36px;padding:0 .6875rem;border:1px solid var(--line);
    border-radius:999px;background:transparent;color:var(--sub);
    font:inherit;font-size:.8125rem;white-space:nowrap;cursor:pointer}
  .chip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);
    color:var(--card)}
  .chip[aria-pressed="true"] b{color:var(--card)}
  main{padding:.75rem;display:grid;gap:.625rem;max-width:44rem;margin:0 auto;
    padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.875rem}
  .card__top{display:flex;justify-content:space-between;align-items:flex-start;
    gap:.5rem}
  .name{font-weight:600;letter-spacing:-.01em}
  .place{color:var(--sub);font-size:.875rem}
  .pill{flex:0 0 auto;font-size:.75rem;font-weight:600;padding:.1875rem .5rem;
    border-radius:999px;background:#eef1f3;color:var(--sub)}
  .s-PENDING{background:#e8f0fe;color:var(--info)}
  .s-CONFIRMED,.s-SHIPPED{background:#fff2e0;color:var(--warn)}
  .s-DELIVERED{background:#e7f6e9;color:var(--ok)}
  .s-CANCELLED,.s-RETURNED,.s-NO_ANSWER{background:#fdecea;color:var(--bad)}
  .meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    margin-top:.5rem;font-size:.875rem;color:var(--sub)}
  .num{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;
    unicode-bidi:plaintext}
  .dot{width:3px;height:3px;border-radius:50%;background:#c3cad1;flex:0 0 auto}
  .warn{color:var(--warn);font-weight:600}
  .what,.addr{margin-top:.375rem;font-size:.875rem}
  .addr{color:var(--sub)}
  .fail{margin-top:.5rem;padding:.5rem .625rem;border-radius:8px;
    background:#fdecea;color:var(--bad);font-size:.8125rem}
  .call{display:flex;align-items:center;justify-content:center;min-height:48px;
    margin-top:.75rem;border-radius:10px;background:var(--ok);color:#fff;
    font-weight:600;text-decoration:none;unicode-bidi:plaintext}
  .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.375rem;
    margin-top:.5rem}
  .acts button{min-height:44px;border:1px solid var(--line);
    background:transparent;border-radius:10px;font:inherit;font-size:.875rem;
    color:var(--ink);cursor:pointer}
  .acts button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
  .note{padding:2.5rem 1.25rem;text-align:center;color:var(--sub)}
  form.gate{max-width:22rem;margin:15vh auto;padding:0 1.25rem;text-align:center}
  form.gate input{width:100%;min-height:48px;margin-top:1rem;padding:0 .75rem;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px}
  form.gate button{width:100%;min-height:48px;margin-top:.625rem;border:0;
    border-radius:10px;background:var(--ink);color:var(--card);font:inherit;
    font-weight:600;cursor:pointer}
  .err{color:var(--bad);font-size:.875rem;margin-top:.75rem}

  /* The language switch: a chip, not a control that competes with the work.
     It sits beside the title, and the pseudo-element gives it the 44px of
     tappable area a thumb actually needs without the box looking heavy. */
  .lang{position:relative;flex:0 0 auto;align-self:center;
    min-width:34px;min-height:30px;
    padding:0 .5rem;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--sub);font:inherit;font-size:.8125rem;
    font-weight:600;cursor:pointer}
  .lang::after{content:"";position:absolute;inset:-7px;border-radius:999px}
  .lang-row{margin-top:1.25rem}

  /* Arabic. Two things break it if left alone: the negative tracking that a
     Latin display face wants, which severs the joins between letters, and a
     line-height tuned for Latin x-height, which crowds the ascenders and
     descenders Arabic actually uses. */
  :root[dir="rtl"] body{
    font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;
    line-height:1.7}
  :root[dir="rtl"] h1,:root[dir="rtl"] .name{letter-spacing:normal}

  /* Money, phone numbers and order references are Latin-digit runs inside
     Arabic text. `plaintext` — not `isolate` — is what keeps a leading digit
     from dragging the whole run to the wrong side. */
  .num,.qty{unicode-bidi:plaintext}
  .shop{unicode-bidi:plaintext}

  /* Two screens, one header. The tabs sit where the filter chips used to be
     the only thing under the title, so they read as navigation rather than as
     another filter. */
  .tabs{display:flex;gap:.375rem;margin-bottom:.5rem}
  .tab{flex:1 1 0;min-height:40px;border:1px solid var(--line);
    border-radius:10px;background:transparent;color:var(--sub);font:inherit;
    font-size:.9375rem;cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);
    color:var(--card);font-weight:600}

  .help{margin:0;color:var(--sub);font-size:.875rem}

  .bulk{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .bulk button{grid-column:1 / -1;min-height:44px;border:1px solid var(--line);
    border-radius:10px;background:transparent;color:var(--ink);font:inherit;
    font-size:.875rem;cursor:pointer}

  /* 16px on every input, without exception. Anything smaller and iOS zooms the
     page on focus and never zooms back — on a 58-row table that is unusable. */
  .bulk input,.rates input{min-height:44px;width:100%;padding:0 .5rem;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px;
    font-variant-numeric:tabular-nums;text-align:center}

  .rates{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:12px}
  .rates th,.rates td{padding:.375rem .5rem;text-align:start}
  /* Deliberately not sticky: the page header already is, with a higher
     stacking context, so a sticky row here would slide under it and vanish.
     The column meaning is carried by each input's aria-label anyway. */
  .rates thead th{background:var(--card);
    font-size:.75rem;font-weight:600;color:var(--sub);text-align:center;
    border-bottom:1px solid var(--line)}
  .rates thead th:first-child{text-align:start}
  .rates .cur{font-weight:400;opacity:.7}
  .rates tbody th{font-weight:400;font-size:.875rem;line-height:1.3}
  /* The table has to fit two 44px inputs and a name on a 360px screen, so the
     numeric columns are pinned and the name takes whatever is left. */
  .rates td{width:5.5rem}
  .wcode{display:inline-block;min-width:1.75rem;color:var(--sub);
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

  /* The save button follows the merchant down 58 rows instead of waiting at
     the bottom of them. */
  .savebar{position:sticky;bottom:0;padding:.625rem .75rem;
    padding-bottom:max(.625rem,env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line)}
  .savebar button{width:100%;min-height:48px;border:0;border-radius:10px;
    background:var(--ok);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .savebar button:disabled{opacity:.65}

  /* ── Carriers ─────────────────────────────────────────────────────────
     A linking form on a phone: one field per line, every control at least
     44px, and the inputs at 16px so iOS does not zoom in on focus and leave
     the merchant stranded halfway through pasting an API key. */
  .cform{display:grid;gap:.625rem;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:.875rem}
  .fld{display:grid;gap:.25rem}
  .fld span{font-size:.8125rem;color:var(--sub)}
  .fld input,.fld select{min-height:44px;width:100%;padding:0 .625rem;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--ink);font:inherit;font-size:16px}
  /* An API key is a Latin run the merchant reads character by character to
     check it; leave it to the paragraph direction and it reorders on them. */
  .fld input[type="password"],.fld input[type="url"]{direction:ltr;
    text-align:start;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:15px}

  .tog{display:flex;align-items:center;gap:.5rem;min-height:44px;
    font-size:.9375rem;cursor:pointer}
  .tog input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto}

  .frow{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .frow button{min-height:46px;border-radius:10px;font:inherit;
    font-weight:600;cursor:pointer;border:1px solid var(--line)}
  .frow .ghost{background:transparent;color:var(--ink)}
  .frow .primary{background:var(--ok);border-color:var(--ok);color:#fff}

  .addbtn{min-height:48px;border:1px dashed var(--line);border-radius:12px;
    background:transparent;color:var(--ink);font:inherit;font-weight:600;
    cursor:pointer}

  .tags{display:flex;flex-direction:column;gap:.25rem;align-items:flex-end}
  .acts--3{grid-template-columns:repeat(3,minmax(0,1fr))}

  /* The test result is the whole point of the test button, so it gets a line
     of its own rather than an alert that vanishes. */
  .testout{margin:.5rem 0 0;font-size:.8125rem;line-height:1.5;
    unicode-bidi:plaintext}
  .testout:empty{display:none}
  .testout--ok{color:var(--ok)}
  .testout--bad{color:var(--bad)}

  .ship{width:100%;min-height:48px;margin-top:.375rem;border:0;
    border-radius:10px;background:var(--ink);color:var(--card);font:inherit;
    font-weight:600;cursor:pointer}
  .ship:disabled{opacity:.7}
</style>
</head>
<body>
<script>
/* Direction before first paint. Set from the script below instead, and an
   Arabic reader gets a frame of left-to-right layout on every visit. */
try {
  var d = localStorage.getItem("mitos:lang") === "ar";
  document.documentElement.dir = d ? "rtl" : "ltr";
  document.documentElement.lang = d ? "ar" : "fr";
} catch (e) {}
</script>
<div id="root"><p class="note">…</p></div>

<script>
(function () {
  "use strict";

  var ROOT = "https://gmgargxjomtaorqjvlyz.supabase.co/functions/v1";
  var API = ROOT + "/admin";
  var CARRIERS = ROOT + "/carriers";
  var KEY = "mitos:key";
  var root = document.getElementById("root");

  /* Both languages, because the person working this list reads one or the
     other and the tool cannot know which. The choice is remembered, and it is
     applied before the first render so an Arabic reader never sees a French
     frame first. */
  var DICT = {
    fr: {
      dir: "ltr", other: "ع",
      title: "Commandes", ask: "Entrez votre clé d'accès.",
      keyPh: "clé d'accès", open: "Ouvrir", refused: "Clé refusée.",
      loading: "Chargement…", offline: "Connexion impossible. Réessayez.",
      none: "Aucune commande ici.", all: "Toutes",
      home: "Domicile", desk: "Bureau", unsure: "à confirmer",
      failed: "Commande non créée chez Shopify — ",
      call: "Appeler", saveFail: "Échec de l'enregistrement. Réessayez.",
      item: "article",
      tabOrders: "Commandes", tabRates: "Livraison",
      ratesHelp: "Le prix que le client voit, et celui qui lui est facturé.",
      applyAll: "Appliquer à toutes les wilayas",
      save: "Enregistrer", saved: "Enregistré", saving: "Enregistrement…",
      tabCarriers: "Transporteurs",
      carriersHelp: "Le colis part au transporteur quand vous confirmez l'appel — jamais avant.",
      addCarrier: "Ajouter un transporteur", provider: "Transporteur",
      carrierName: "Nom", baseUrl: "Adresse de l'API",
      fromWilaya: "Wilaya de départ",
      setDefault: "Par défaut", autoPush: "Envoi automatique",
      test: "Tester", testing: "Test…", edit: "Modifier", remove: "Supprimer",
      cancel: "Annuler", noCarriers: "Aucun transporteur relié.",
      send: "Envoyer au transporteur", sending: "Envoi…", sent: "Envoyé",
      credsKept: "Laissez vide pour garder les identifiants enregistrés.",
      confirmRemove: "Supprimer ce transporteur ?",
      needName: "Donnez-lui un nom.",
      PENDING: "À appeler", CONFIRMED: "Confirmée", SHIPPED: "Expédiée",
      DELIVERED: "Livrée", CANCELLED: "Annulée", RETURNED: "Retournée",
      NO_ANSWER: "Sans réponse"
    },
    ar: {
      dir: "rtl", other: "FR",
      title: "الطلبيات", ask: "أدخل مفتاح الدخول.",
      keyPh: "مفتاح الدخول", open: "دخول", refused: "المفتاح مرفوض.",
      loading: "جارٍ التحميل…", offline: "تعذّر الاتصال. أعد المحاولة.",
      none: "لا توجد طلبيات هنا.", all: "الكل",
      home: "للمنزل", desk: "للمكتب", unsure: "للتأكيد",
      failed: "لم تُنشأ الطلبية في Shopify — ",
      call: "اتصل", saveFail: "لم يُسجّل التغيير. أعد المحاولة.",
      item: "قطعة",
      tabOrders: "الطلبيات", tabRates: "التوصيل",
      ratesHelp: "السعر الذي يراه العميل، وهو نفسه الذي يُحسب عليه.",
      applyAll: "طبّق على كل الولايات",
      save: "حفظ", saved: "تم الحفظ", saving: "جارٍ الحفظ…",
      tabCarriers: "الناقلون",
      carriersHelp: "الطرد يذهب للناقل عند تأكيدك للمكالمة — لا قبلها.",
      addCarrier: "أضف ناقلًا", provider: "الناقل",
      carrierName: "الاسم", baseUrl: "عنوان الـAPI",
      fromWilaya: "ولاية الانطلاق",
      setDefault: "الافتراضي", autoPush: "إرسال تلقائي",
      test: "اختبر", testing: "جارٍ الاختبار…", edit: "تعديل", remove: "حذف",
      cancel: "إلغاء", noCarriers: "لا يوجد ناقل مربوط.",
      send: "أرسل للناقل", sending: "جارٍ الإرسال…", sent: "أُرسل",
      credsKept: "اتركه فارغًا للإبقاء على البيانات المحفوظة.",
      confirmRemove: "حذف هذا الناقل؟",
      needName: "أعطه اسمًا.",
      PENDING: "للاتصال", CONFIRMED: "مؤكّدة", SHIPPED: "أُرسلت",
      DELIVERED: "سُلّمت", CANCELLED: "ملغاة", RETURNED: "مرتجعة",
      NO_ANSWER: "بلا ردّ"
    }
  };

  var LANG = "mitos:lang";
  var lang = (function () {
    try { return DICT[localStorage.getItem(LANG)] ? localStorage.getItem(LANG) : "fr"; }
    catch (e) { return "fr"; }
  })();

  function t() { return DICT[lang]; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = t().dir;
    /* The tab is how a merchant finds this again among open tabs. */
    document.title = "MITOS — " + t().title;
  }

  function toggleLang() {
    lang = lang === "fr" ? "ar" : "fr";
    try { localStorage.setItem(LANG, lang); } catch (e) {}
    applyLang();
  }

  var ORDER = ["PENDING","CONFIRMED","SHIPPED","DELIVERED","NO_ANSWER","CANCELLED","RETURNED"];
  var filter = "";
  var view = "orders";

  /* Names and addresses are typed by whoever filled the order form. They are
     escaped, not trusted, even though they came back from our own API. */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }

  function key() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "x-mitos-key": key() }, options.headers || {}
    );
    return fetch(API + (path || ""), options);
  }

  function carrierApi(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "x-mitos-key": key() }, options.headers || {}
    );
    return fetch(CARRIERS + (path || ""), options);
  }

  function langButton() {
    return '<button class="lang" type="button" data-lang lang="' +
      (lang === "fr" ? "ar" : "fr") + '">' + t().other + "</button>";
  }

  function gate(message) {
    root.innerHTML =
      '<form class="gate">' +
        '<h1>MITOS</h1>' +
        '<p class="note" style="padding:.5rem 0">' + esc(t().ask) + "</p>" +
        '<input type="password" name="k" autocomplete="current-password" ' +
          'placeholder="' + esc(t().keyPh) + '" required>' +
        "<button type=\"submit\">" + esc(t().open) + "</button>" +
        (message ? '<p class="err">' + esc(message) + "</p>" : "") +
        '<div class="lang-row">' + langButton() + "</div>" +
      "</form>";

    root.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = e.target.k.value.trim();
      if (!v) return;
      try { localStorage.setItem(KEY, v); } catch (err) {}
      show();
    });
  }

  function money(n, currency) {
    var suffix = currency === "DZD" ? "DA" : currency;
    return new Intl.NumberFormat("fr-FR").format(n) + " " + suffix;
  }

  function card(o, currency) {
    var items = Array.isArray(o.items) ? o.items : [];
    /* The quantity is a digit next to a word that may be Arabic, so the run
       is isolated — otherwise "3× قميص" reorders around the number. */
    var what = items.map(function (i) {
      return '<span class="qty">' + esc(i.qty + "× " + (i.title || t().item)) +
        "</span>";
    }).join(", ");

    return '<article class="card" data-id="' + esc(o.id) + '">' +
      '<header class="card__top"><div>' +
        '<div class="name">' + esc(o.firstName) + " " + esc(o.lastName) + "</div>" +
        '<div class="place">' + esc(o.commune) + ", " + esc(o.wilayaName) + "</div>" +
      '</div><span class="pill s-' + esc(o.status) + '" data-pill>' +
        esc(t()[o.status] || o.status) + "</span></header>" +

      '<div class="meta">' +
        "<span>" + esc(o.delivery === "DESK" ? t().desk : t().home) + "</span>" +
        '<span class="dot"></span>' +
        '<span class="num">' + esc(money(o.total, currency)) + "</span>" +
        (o.pricesVerified ? "" : '<span class="warn">' + esc(t().unsure) + "</span>") +
        (o.shopifyName
          ? '<span class="dot"></span><span class="num">' + esc(o.shopifyName) + "</span>"
          : "") +
      "</div>" +

      (what ? '<div class="what">' + what + "</div>" : "") +
      '<div class="addr">' + esc(o.address) + "</div>" +

      (o.createFailed
        ? '<div class="fail">' + esc(t().failed) +
          esc(String(o.createError || "").slice(0, 140)) + "</div>"
        : "") +

      '<a class="call" href="tel:' + esc(o.phone) + '">' + esc(t().call) +
        ' <span class="num">' + esc(o.phone) + "</span></a>" +

      '<div class="acts">' +
        ["CONFIRMED","NO_ANSWER","DELIVERED","CANCELLED"].map(function (s) {
          return '<button type="button" data-set="' + s + '"' +
            (o.status === s ? ' aria-pressed="true"' : "") + ">" +
            esc(t()[s]) + "</button>";
        }).join("") +
      "</div>" +

      /* Only once the call has gone the merchant's way. A parcel handed to a
         carrier before the customer confirms is a return the merchant pays
         for, so the button does not exist until then. */
      (o.status === "CONFIRMED"
        ? '<button type="button" class="ship" data-send="' + esc(o.id) + '">' +
          esc(t().send) + "</button>"
        : "") +
      "</article>";
  }

  function render(data) {
    var counts = data.counts || {};
    var total = Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0);

    var chips = '<button class="chip" data-filter=""' +
      (filter === "" ? ' aria-pressed="true"' : "") +
      ">" + esc(t().all) + "<b>" + total + "</b></button>" +
      ORDER.filter(function (s) { return counts[s]; }).map(function (s) {
        return '<button class="chip" data-filter="' + s + '"' +
          (filter === s ? ' aria-pressed="true"' : "") + ">" +
          esc(t()[s]) + "<b>" + counts[s] + "</b></button>";
      }).join("");

    var currency = (data.shop && data.shop.currency) || "DZD";
    var body = data.orders.length
      ? data.orders.map(function (o) { return card(o, currency); }).join("")
      : '<p class="note">' + esc(t().none) + "</p>";

    root.innerHTML =
      bar(data, '<nav class="chips">' + chips + "</nav>") +
      "<main>" + body + "</main>";
  }

  /* The header is identical on both screens, so it is built once — the tabs
     are the only way between them and must not move or change shape when the
     screen does. */
  function bar(data, below) {
    return '<header class="bar"><div class="bar__row">' +
        "<h1>" + esc(view === "rates" ? t().tabRates
          : view === "carriers" ? t().tabCarriers : t().title) + "</h1>" +
        '<span class="shop">' + esc((data.shop && data.shop.domain) || "") + "</span>" +
        langButton() +
      "</div>" +
      '<nav class="tabs">' +
        ["orders","rates","carriers"].map(function (v) {
          var label = v === "rates" ? t().tabRates
            : v === "carriers" ? t().tabCarriers : t().tabOrders;
          return '<button class="tab" type="button" data-view="' + v + '"' +
            (view === v ? ' aria-pressed="true"' : "") + ">" +
            esc(label) + "</button>";
        }).join("") +
      "</nav>" + (below || "") + "</header>";
  }

  /**
   * The shipping table.
   *
   * Every wilaya is listed, including the ones with no row of their own: a
   * merchant cannot otherwise tell "costs nothing" from "never set", and those
   * are exactly the ones the order endpoint quietly prices at the shop
   * default. Those show the default as a placeholder rather than a value, so
   * the distinction stays visible.
   */
  function renderRates(data) {
    var fb = data.fallback || [600, 350];
    var cur = (data.shop && data.shop.currency) === "DZD"
      ? "DA" : (data.shop && data.shop.currency) || "DA";

    var rows = (data.wilayas || []).map(function (w) {
      return '<tr data-code="' + esc(w.code) + '">' +
        '<th scope="row"><span class="wcode">' + esc(w.code) + "</span> " +
          esc(lang === "ar" ? w.nameAr : w.nameFr) + "</th>" +
        '<td><input type="number" inputmode="numeric" min="0" step="10" ' +
          'data-rate="home" aria-label="' + esc(t().home) + '" ' +
          'placeholder="' + fb[0] + '" value="' +
          (w.homeRate == null ? "" : w.homeRate) + '"></td>' +
        '<td><input type="number" inputmode="numeric" min="0" step="10" ' +
          'data-rate="desk" aria-label="' + esc(t().desk) + '" ' +
          'placeholder="' + fb[1] + '" value="' +
          (w.deskRate == null ? "" : w.deskRate) + '"></td>' +
      "</tr>";
    }).join("");

    root.innerHTML = bar(data) +
      "<main>" +
        '<p class="help">' + esc(t().ratesHelp) + "</p>" +

        '<div class="bulk">' +
          '<input type="number" inputmode="numeric" min="0" step="10" ' +
            'id="all-home" placeholder="' + esc(t().home) + '">' +
          '<input type="number" inputmode="numeric" min="0" step="10" ' +
            'id="all-desk" placeholder="' + esc(t().desk) + '">' +
          '<button type="button" data-apply-all>' + esc(t().applyAll) + "</button>" +
        "</div>" +

        '<table class="rates"><thead><tr>' +
          "<th></th>" +
          "<th>" + esc(t().home) + " <span class=\"cur\">" + esc(cur) + "</span></th>" +
          "<th>" + esc(t().desk) + " <span class=\"cur\">" + esc(cur) + "</span></th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>" +
      "</main>" +
      '<div class="savebar"><button type="button" data-save-rates>' +
        esc(t().save) + "</button></div>";
  }

  function loadRates() {
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";
    api("/rates")
      .then(function (r) {
        if (r.status === 404) throw new Error("bad-key");
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then(renderRates)
      .catch(function (e) {
        if (e.message === "bad-key") {
          try { localStorage.removeItem(KEY); } catch (err) {}
          return gate(t().refused);
        }
        root.innerHTML = '<p class="note">' + esc(t().offline) + "</p>";
      });
  }

  /**
   * Sends the whole table, not just what was touched.
   *
   * A blank field means "use the shop default", so it is left out entirely
   * rather than sent as a zero — free delivery and unset are different things,
   * and zero is the one a careless save would write.
   */
  function saveRates(btn) {
    var rates = {};
    var bad = null;

    [].forEach.call(document.querySelectorAll(".rates tbody tr"), function (tr) {
      var h = tr.querySelector('[data-rate="home"]');
      var d = tr.querySelector('[data-rate="desk"]');
      if (h.value === "" && d.value === "") return;
      var hv = Number(h.value === "" ? h.placeholder : h.value);
      var dv = Number(d.value === "" ? d.placeholder : d.value);
      if (!isFinite(hv) || !isFinite(dv) || hv < 0 || dv < 0) {
        bad = bad || (h.value !== "" && (!isFinite(hv) || hv < 0) ? h : d);
        return;
      }
      rates[tr.dataset.code] = [Math.round(hv), Math.round(dv)];
    });

    if (bad) {
      bad.focus();
      bad.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }

    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().saving;

    api("/rates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rates: rates })
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function () {
        btn.textContent = t().saved;
        setTimeout(function () {
          btn.textContent = was;
          btn.disabled = false;
        }, 1400);
      })
      .catch(function () {
        btn.textContent = was;
        btn.disabled = false;
        alert(t().saveFail);
      });
  }

  /* ── Carriers ─────────────────────────────────────────────────────────
     Kept in a variable so changing the provider in the form can redraw the
     credential fields without a round trip — each provider asks for a
     different pair, and refetching to learn that would make the select feel
     broken. */
  var carrierData = null;
  var editing = null;   // carrier id being edited, or null for a new one
  var formOpen = false;

  function providerMeta(name) {
    return ((carrierData && carrierData.providers) || []).filter(
      function (p) { return p.provider === name; }
    )[0] || { fields: [], needsBaseUrl: false };
  }

  function carrierForm() {
    var editRow = (carrierData.carriers || []).filter(function (c) {
      return c.id === editing;
    })[0] || null;

    var chosen = formOpen && formOpen !== true ? formOpen
      : editRow ? editRow.provider : "YALIDINE";
    var meta = providerMeta(chosen);

    var creds = meta.fields.map(function (f) {
      return '<label class="fld"><span>' + esc(f.label) + "</span>" +
        '<input type="password" autocomplete="new-password" ' +
          'data-cred="' + esc(f.key) + '" placeholder="' +
          (editRow && editRow.hasCredentials ? "••••••••" : "") + '"></label>';
    }).join("");

    return '<form class="cform" novalidate>' +
      '<label class="fld"><span>' + esc(t().provider) + "</span>" +
        '<select data-provider>' +
          ((carrierData.providers || []).map(function (p) {
            return '<option value="' + esc(p.provider) + '"' +
              (p.provider === chosen ? " selected" : "") + ">" +
              esc(p.provider.replace(/_/g, " ")) + "</option>";
          }).join("")) +
        "</select></label>" +

      '<label class="fld"><span>' + esc(t().carrierName) + "</span>" +
        '<input type="text" data-name value="' +
          esc(editRow ? editRow.name : "") + '"></label>' +

      (meta.needsBaseUrl
        ? '<label class="fld"><span>' + esc(t().baseUrl) + "</span>" +
          '<input type="url" inputmode="url" data-baseurl dir="ltr" ' +
            'placeholder="https://xxx.ecotrack.dz" value="' +
            esc(editRow && editRow.baseUrl ? editRow.baseUrl : "") + '"></label>'
        : "") +

      (chosen === "YALIDINE" || chosen === "NOEST"
        ? '<label class="fld"><span>' + esc(t().fromWilaya) + "</span>" +
          '<input type="text" data-fromwilaya placeholder="Alger" value="' +
            esc(editRow && editRow.fromWilaya ? editRow.fromWilaya : "") +
            '"></label>'
        : "") +

      creds +
      (meta.fields.length
        ? '<p class="help">' + esc(t().credsKept) + "</p>" : "") +

      '<label class="tog"><input type="checkbox" data-default' +
        (editRow && editRow.isDefault ? " checked" : "") + "><span>" +
        esc(t().setDefault) + "</span></label>" +
      '<label class="tog"><input type="checkbox" data-autopush' +
        (editRow && editRow.autoPush ? " checked" : "") + "><span>" +
        esc(t().autoPush) + "</span></label>" +

      '<div class="frow">' +
        '<button type="button" class="ghost" data-cancel>' + esc(t().cancel) +
        "</button>" +
        '<button type="button" class="primary" data-save-carrier>' +
          esc(t().save) + "</button>" +
      "</div></form>";
  }

  function carrierCard(c) {
    return '<article class="card" data-carrier="' + esc(c.id) + '">' +
      '<header class="card__top"><div>' +
        '<div class="name">' + esc(c.name) + "</div>" +
        '<div class="place">' + esc(c.provider.replace(/_/g, " ")) + "</div>" +
      "</div><div class=\"tags\">" +
        (c.isDefault ? '<span class="pill s-DELIVERED">' + esc(t().setDefault) + "</span>" : "") +
        (c.autoPush ? '<span class="pill s-CONFIRMED">' + esc(t().autoPush) + "</span>" : "") +
        (c.enabled ? "" : '<span class="pill s-CANCELLED">off</span>') +
      "</div></header>" +

      '<div class="meta">' +
        '<span class="num">' + c.ratedWilayas + "</span><span>wilayas</span>" +
        '<span class="dot"></span>' +
        '<span class="num">' + c.shipments + "</span><span>colis</span>" +
      "</div>" +
      '<p class="testout" data-testout></p>' +

      '<div class="acts acts--3">' +
        '<button type="button" data-test="' + esc(c.id) + '">' + esc(t().test) + "</button>" +
        '<button type="button" data-edit="' + esc(c.id) + '">' + esc(t().edit) + "</button>" +
        '<button type="button" data-remove="' + esc(c.id) + '">' + esc(t().remove) + "</button>" +
      "</div></article>";
  }

  function renderCarriers(data) {
    carrierData = data;
    var list = (data.carriers || []).map(carrierCard).join("") ||
      '<p class="note">' + esc(t().noCarriers) + "</p>";

    root.innerHTML = bar(data) +
      "<main>" +
        '<p class="help">' + esc(t().carriersHelp) + "</p>" +
        list +
        (formOpen
          ? carrierForm()
          : '<button type="button" class="addbtn" data-add>' +
            esc(t().addCarrier) + "</button>") +
      "</main>";
  }

  function loadCarriers() {
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";
    carrierApi("")
      .then(function (r) {
        if (r.status === 404) throw new Error("bad-key");
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then(renderCarriers)
      .catch(function (e) {
        if (e.message === "bad-key") {
          try { localStorage.removeItem(KEY); } catch (err) {}
          return gate(t().refused);
        }
        root.innerHTML = '<p class="note">' + esc(t().offline) + "</p>";
      });
  }

  function submitCarrier(btn) {
    var form = btn.closest(".cform");
    var name = form.querySelector("[data-name]").value.trim();
    if (!name) {
      alert(t().needName);
      form.querySelector("[data-name]").focus();
      return;
    }

    /* Blank credential fields are omitted rather than sent empty, so saving a
       name or a toggle from this form never wipes a working token. */
    var creds = {};
    [].forEach.call(form.querySelectorAll("[data-cred]"), function (i) {
      if (i.value.trim()) creds[i.getAttribute("data-cred")] = i.value.trim();
    });

    var baseEl = form.querySelector("[data-baseurl]");
    var fromEl = form.querySelector("[data-fromwilaya]");

    var body = {
      id: editing || undefined,
      provider: form.querySelector("[data-provider]").value,
      name: name,
      baseUrl: baseEl ? baseEl.value.trim() : null,
      fromWilaya: fromEl ? fromEl.value.trim() : null,
      isDefault: form.querySelector("[data-default]").checked,
      autoPush: form.querySelector("[data-autopush]").checked
    };
    if (Object.keys(creds).length) body.credentials = creds;

    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().saving;

    carrierApi("", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); })
      .then(function (x) {
        if (!x.r.ok) throw new Error(x.d.error || x.r.status);
        formOpen = false; editing = null;
        loadCarriers();
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = was;
        alert(t().saveFail + " (" + e.message + ")");
      });
  }

  /* The button that turns a documented guess into a fact. Every adapter was
     written from public documentation; this is how the merchant finds out in
     one tap whether it matched their account. */
  function runTest(btn, id) {
    var card = btn.closest(".card");
    var out = card.querySelector("[data-testout]");
    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().testing;
    out.textContent = "";
    out.className = "testout";

    carrierApi("/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        out.textContent = d.detail || (d.ok ? "ok" : "");
        out.className = "testout " + (d.ok ? "testout--ok" : "testout--bad");
      })
      .catch(function () {
        out.textContent = t().offline;
        out.className = "testout testout--bad";
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = was;
      });
  }

  function sendToCarrier(btn, orderId) {
    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().sending;

    carrierApi("/push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: orderId })
    })
      .then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); })
      .then(function (x) {
        if (!x.r.ok || x.d.ok === false) {
          throw new Error(x.d.detail || x.d.error || x.r.status);
        }
        btn.textContent = t().sent + " · " + (x.d.trackingNumber || "");
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = was;
        alert(e.message);
      });
  }

  function load() {
    if (!key()) return gate("");
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";

    api(filter ? "?s=" + encodeURIComponent(filter) : "")
      .then(function (r) {
        /* 404 is what a wrong key looks like: the API refuses to confirm
           that anything is there at all. */
        if (r.status === 404) throw new Error("bad-key");
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        if (e.message === "bad-key") {
          try { localStorage.removeItem(KEY); } catch (err) {}
          return gate(t().refused);
        }
        root.innerHTML = '<p class="note">' + esc(t().offline) + "</p>";
      });
  }

  function show() {
    if (!key()) return gate("");
    return view === "rates" ? loadRates()
      : view === "carriers" ? loadCarriers()
      : load();
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-lang]")) {
      toggleLang();
      return show();
    }

    var add = e.target.closest("[data-add]");
    if (add) { formOpen = true; editing = null; return renderCarriers(carrierData); }

    if (e.target.closest("[data-cancel]")) {
      formOpen = false; editing = null;
      return renderCarriers(carrierData);
    }

    var saveCarrierBtn = e.target.closest("[data-save-carrier]");
    if (saveCarrierBtn) return submitCarrier(saveCarrierBtn);

    var testBtn = e.target.closest("[data-test]");
    if (testBtn) return runTest(testBtn, testBtn.getAttribute("data-test"));

    var editBtn = e.target.closest("[data-edit]");
    if (editBtn) {
      editing = editBtn.getAttribute("data-edit");
      formOpen = true;
      return renderCarriers(carrierData);
    }

    var rmBtn = e.target.closest("[data-remove]");
    if (rmBtn) {
      if (!confirm(t().confirmRemove)) return;
      return carrierApi("/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: rmBtn.getAttribute("data-remove") })
      }).then(loadCarriers).catch(function () { alert(t().saveFail); });
    }

    var sendBtn = e.target.closest("[data-send]");
    if (sendBtn) return sendToCarrier(sendBtn, sendBtn.getAttribute("data-send"));

    var tab = e.target.closest("[data-view]");
    if (tab) {
      view = tab.getAttribute("data-view");
      return show();
    }

    var saveBtn = e.target.closest("[data-save-rates]");
    if (saveBtn) return saveRates(saveBtn);

    if (e.target.closest("[data-apply-all]")) {
      /* Almost every merchant charges one price everywhere and a different one
         for a handful of wilayas. Typing 58 rows to express that is the kind of
         work that stops a table from ever being filled in. */
      var h = document.getElementById("all-home").value;
      var d = document.getElementById("all-desk").value;
      [].forEach.call(document.querySelectorAll(".rates tbody tr"), function (tr) {
        if (h !== "") tr.querySelector('[data-rate="home"]').value = h;
        if (d !== "") tr.querySelector('[data-rate="desk"]').value = d;
      });
      return;
    }

    var chip = e.target.closest("[data-filter]");
    if (chip) {
      filter = chip.getAttribute("data-filter");
      return load();
    }

    var btn = e.target.closest("[data-set]");
    if (!btn) return;

    /* The status is shown as changed straight away and rolled back if the
       write fails. A merchant tapping through a call list must never be left
       unsure whether it saved. */
    var card = btn.closest(".card");
    var pill = card.querySelector("[data-pill]");
    var want = btn.getAttribute("data-set");
    var before = { text: pill.textContent, cls: pill.className };

    card.querySelectorAll("[data-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    pill.textContent = t()[want] || want;
    pill.className = "pill s-" + want;

    api("", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: card.dataset.id, status: want })
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); })
      .catch(function () {
        pill.textContent = before.text;
        pill.className = before.cls;
        btn.setAttribute("aria-pressed", "false");
        alert(t().saveFail);
      });
  });

  /* The provider select changes which credentials are asked for, so the form
     is redrawn from the cached provider list rather than refetched. */
  document.addEventListener("change", function (e) {
    var sel = e.target.closest("[data-provider]");
    if (!sel || !carrierData) return;
    formOpen = sel.value;
    renderCarriers(carrierData);
  });

  applyLang();
  show();
})();
</script>

<script>
/* The service worker only makes the app open without signal — it caches the
   shell and never the orders. Registration is deliberately last and wrapped:
   a browser that does not support it, or a private window that refuses it,
   must not stop the call list from working. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* Nothing to tell the merchant. The page works either way. */
    });
  });
}
</script>
</body>
</html>
