<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101418">

<!-- Installable on a phone's home screen. The merchant works this list all
     day, standing up, and a tab among twenty tabs is not that. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MITOS">
<meta name="mobile-web-app-capable" content="yes">

<title>MITOS — Commandes</title>
<!--
  The merchant's call list, and the shipping table behind it.

  A cash-on-delivery merchant's day is a call list: ring the customer,
  confirm, hand to the courier. They do it from a phone, standing up. So this
  is one screen, one column, and every control is a thumb-sized target.

  It is a static file on purpose. It holds no secret, talks to no database,
  and needs no environment: the merchant's key lives in their own browser and
  is sent as a bearer header to the Supabase function that owns the data.
  That is why it could be deployed without anyone pasting credentials
  anywhere — which is the only reason this exists rather than the embedded
  Shopify screen in app/routes/app._index.tsx.
-->
<style>
  :root{
    /* ── The system palette ──────────────────────────────────────────────
     *
     * These are Apple's own system colours, not approximations of them. A
     * merchant runs this beside Téléphone and Réglages all day, and a screen
     * with its own idea of what grey is looks like a web page pretending to
     * be an app. The greys, the separators and the fills come from iOS; the
     * violet-to-cyan gradient stays ours, because that is the part that is
     * supposed to be different.
     *
     * The status colours are Apple's *accessible* variants, not the standard
     * ones: systemGreen on white is 2.2:1, which is fine for a filled dot and
     * unreadable as a word. These are the ones Apple ships for text.
     */
    --ink:#000; --sub:rgba(60,60,67,.6); --line:rgba(60,60,67,.18);
    --bg:#f2f2f7; --card:#fff;
    /* systemFill, the grey a segmented control's track is made of. */
    --fill:rgba(120,120,128,.12);
    --fill-2:rgba(120,120,128,.2);
    /* Status colours, chosen to sit beside a violet-to-cyan brand rather than
       against it — the previous set was a brown amber and a brick red, and a
       stripe of #a35b00 down the edge of a card reads as dirt. Each one is
       dark enough for bold small text on its own tint: measured on white at
       4.8:1 or better, which is where a status word stops being decoration
       and starts being readable. */
    --ok:#248a3d; --bad:#d70015; --warn:#c93400; --info:#0040dd;
    --ok-bg:rgba(52,199,89,.12); --bad-bg:rgba(255,59,48,.12);
    --warn-bg:rgba(255,149,0,.14); --info-bg:rgba(0,122,255,.12);
    /* A stripe is a fill, not a word. The accessible variants above are
       darkened until small bold text reads on white, which makes them muddy
       as a solid bar — #c93400 down the edge of a card looks like rust. These
       are the plain system colours, used only where nothing has to be read
       on top of them. */
    --tint-ok:#34c759; --tint-bad:#ff3b30;
    --tint-warn:#ff9500; --tint-info:#007aff;

    /* The brand, sampled from brand/mitos-mark.png rather than guessed: these
       are the two most saturated pixels at each end of the logo's gradient.
       Everything branded on this screen is one of these three tokens, so the
       app cannot drift away from the mark it ships with. */
    --brand-a:#a700ff; --brand-b:#00dfff;
    --brand:linear-gradient(120deg,var(--brand-a),var(--brand-b));
    /* A solid stand-in for the gradient, for text and icons that cannot carry
       one. Dark enough to pass contrast on white, which neither end is. */
    --brand-ink:#6d1fd6;
    --brand-soft:rgba(167,0,255,.09);

    /* The floating bar is translucent over whatever scrolls under it. */
    --glass:rgba(255,255,255,.72);
    --glass-line:rgba(255,255,255,.5);
    --glass-shadow:0 10px 34px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    /* iOS dark: a true black base, cards one step up from it, and separators
       that are light at low alpha rather than a dark grey — a dark-grey line
       on a dark card disappears, which is why the borders vanished here. */
    :root{--ink:#fff;--sub:rgba(235,235,245,.6);--line:rgba(84,84,88,.65);
      --bg:#000;--card:#1c1c1e;
      --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
      /* The mark is drawn for white. On a dark ground the violet end goes
         muddy, so the solid stand-in is lifted rather than reused. */
      --brand-ink:#c79bff; --brand-soft:rgba(167,0,255,.18);
      --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.10);
      --glass-shadow:0 10px 34px rgba(0,0,0,.6);
      /* Lifted for a dark ground, and the tints are near-black washes: the
         light ones would each become a glowing block on a dark card. */
      --ok:#30db5b; --bad:#ff6961; --warn:#ffb340; --info:#409cff;
      --ok-bg:rgba(48,209,88,.18); --bad-bg:rgba(255,69,58,.18);
      --warn-bg:rgba(255,159,10,.18); --info-bg:rgba(10,132,255,.18);
      --tint-ok:#30d158; --tint-bad:#ff453a;
      --tint-warn:#ff9f0a; --tint-info:#0a84ff}
  }
  *{box-sizing:border-box}

  /* The blue that appears on every tap is Safari's, not ours: a translucent
     highlight on touch and a system focus ring after it. Both are drawn in
     the platform accent, which here sits beside a violet-to-cyan brand and
     looks like a bug. They are replaced rather than merely removed — a
     control still has to show it has focus for anyone using a keyboard. */
  button,a,select,input,textarea{-webkit-tap-highlight-color:transparent}
  button,select,.chip,.tabbar__item,.acts button,.seg__item{
    -webkit-user-select:none;user-select:none}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;
    border-radius:10px}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:var(--card);
    border-bottom:1px solid var(--line);padding:.75rem 1rem .5rem;
    padding-top:max(.75rem,env(safe-area-inset-top))}
  .bar__row{display:flex;align-items:center;justify-content:space-between;
    gap:.5rem;margin-bottom:.5rem}
  /* A large title, the way an iOS screen names itself. */
  h1{margin:0;font-size:1.625rem;font-weight:700;letter-spacing:-.022em;
    line-height:1.15}
  /* ── Filtering, as a segmented control ───────────────────────────────
   *
   * The filters were free-floating pills, which on a phone read as seven
   * separate buttons rather than one choice with seven answers. A segmented
   * control says it in the shape: a single track, one segment raised out of
   * it, exactly one of them true at a time.
   *
   * The track scrolls when a shop has more statuses in play than fit — the
   * alternative is segments too narrow to read, and a merchant filtering on
   * "Sans réponse" needs to see the words.
   */
  .seg{display:flex;gap:2px;padding:2px;margin-bottom:.125rem;
    border-radius:9px;background:var(--fill);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .seg::-webkit-scrollbar{display:none}
  .seg__item{flex:1 0 auto;display:inline-flex;align-items:center;
    justify-content:center;gap:.3125rem;min-height:30px;padding:0 .625rem;
    border:0;border-radius:7px;background:transparent;color:var(--ink);
    font:inherit;font-size:.8125rem;font-weight:500;white-space:nowrap;
    cursor:pointer;transition:background-color .18s ease}
  .seg__item b{font-weight:600;color:var(--sub);
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

  /* The raised segment: white on the track in light, a lifted grey in dark,
     with the shadow iOS actually uses under the thumb. */
  .seg__item[aria-pressed="true"]{background:var(--card);font-weight:600;
    box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
  .seg__item[aria-pressed="true"] b{color:var(--brand-ink)}
  main{padding:.75rem;display:grid;gap:.625rem;max-width:44rem;margin:0 auto;
    padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  /* A card, not a boxed row: the hairline border made a list of orders read as
     a table, and this is a stack of things to act on. A soft shadow lifts each
     one off the page instead. */
  .card{--accent:var(--fill-2);position:relative;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:1rem;box-shadow:0 1px 2px rgba(16,20,24,.04),
    0 6px 16px -8px rgba(16,20,24,.10)}

  /* A stripe down the leading edge in the status colour. Scrolling a list of
     forty orders, this is the only thing that can be read at a glance without
     stopping — the words all look alike at speed, the colours do not.
     inset-inline-start, so it moves to the right edge in Arabic instead of
     sitting on the wrong side of every card. */
  .card::before{content:"";position:absolute;top:0;bottom:0;
    inset-inline-start:0;width:3px;background:var(--accent)}
  /* Amber is the order that still needs the merchant to do something; blue is
     the one already moving. That was the wrong way round — a confirmed order
     was flagged in warning orange while an uncalled one sat in calm blue,
     which is exactly backwards for a screen whose whole job is "who do I ring
     next". */
  .c-PENDING,.c-NO_ANSWER{--accent:var(--tint-warn)}
  .c-CONFIRMED,.c-SHIPPED{--accent:var(--tint-info)}
  .c-DELIVERED{--accent:var(--tint-ok)}
  .c-CANCELLED,.c-RETURNED{--accent:var(--tint-bad)}

  .card__top{display:flex;justify-content:space-between;align-items:baseline;
    gap:.75rem}
  .name{font-weight:650;letter-spacing:-.01em;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  /* The money, given the size it deserves. This is a cash-on-delivery shop:
     the amount is what the merchant will be handed at the door, and it used
     to sit in the middle of a grey row between the delivery method and the
     order number, at the same weight as both. */
  .amount{flex:0 0 auto;font-size:1.125rem;font-weight:700;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    unicode-bidi:plaintext}
  .amount--unsure{color:var(--warn)}

  .pill{flex:0 0 auto;font-size:.75rem;font-weight:600;padding:.1875rem .5rem;
    border-radius:999px;background:var(--fill);color:var(--sub)}
  /* The badge follows the stripe, or a card says two things at once. */
  .s-PENDING{background:var(--warn-bg);color:var(--warn)}
  .s-NO_ANSWER{background:var(--warn-bg);color:var(--warn)}
  .s-CONFIRMED,.s-SHIPPED{background:var(--info-bg);color:var(--info)}
  .s-DELIVERED{background:var(--ok-bg);color:var(--ok)}
  .s-CANCELLED,.s-RETURNED{background:var(--bad-bg);color:var(--bad)}
  .meta{display:flex;align-items:center;gap:.375rem .5rem;flex-wrap:wrap;
    margin-top:.375rem;font-size:.8125rem;color:var(--sub)}
  .num{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;
    unicode-bidi:plaintext}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--fill-2);
    flex:0 0 auto}
  .warn{color:var(--warn);font-weight:600}
  .what,.addr{margin-top:.375rem;font-size:.875rem}
  .addr{color:var(--sub)}
  .fail{margin-top:.5rem;padding:.5rem .625rem;border-radius:11px;
    background:var(--bad-bg);color:var(--bad);font-size:.8125rem}
  /* gap, not a space in the markup: the label and the number are two flex
     children and the whitespace between them is discarded, which is why this
     read "Appeler0770889900" for as long as the button has existed. */
  /* The one action this whole screen exists for, so it carries the brand
     rather than a generic green. The handset says "call"; the colour says
     whose app this is. */
  .call{display:flex;align-items:center;justify-content:center;gap:.5rem;
    min-height:50px;
    margin-top:.75rem;border-radius:13px;background:var(--brand);color:#fff;
    font-weight:600;text-decoration:none;unicode-bidi:plaintext;
    box-shadow:0 6px 16px -6px rgba(167,0,255,.5)}
  .call svg{width:18px;height:18px;flex:0 0 auto}
  /* .num paints itself var(--ink) everywhere else on the card, which on this
     button meant a near-black phone number on a saturated ground. The number
     is part of the label here, so it takes the label's colour. */
  .call .num{color:inherit}
  .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.375rem;
    margin-top:.625rem}
  .acts button{min-height:44px;border:1px solid var(--line);
    background:transparent;border-radius:10px;font:inherit;font-size:.875rem;
    color:var(--ink);cursor:pointer}
  .acts button[aria-pressed="true"]{border-color:var(--brand-ink);
    background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .note{padding:2.5rem 1.25rem;text-align:center;color:var(--sub)}
  form.gate{max-width:22rem;margin:15vh auto;padding:0 1.25rem;text-align:center}
  /* alt="" on purpose: the <h1> underneath already says MITOS, and a
     screen reader announcing it twice is noise, not information. */
  form.gate .gate__mark{display:block;margin:0 auto .5rem;height:auto}
  form.gate input{width:100%;min-height:48px;margin-top:1rem;padding:0 .75rem;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px}
  form.gate button{width:100%;min-height:48px;margin-top:.625rem;border:0;
    border-radius:10px;background:var(--ink);color:var(--card);font:inherit;
    font-weight:600;cursor:pointer}
  .err{color:var(--bad);font-size:.875rem;margin-top:.75rem}

  /* The language switch: a chip, not a control that competes with the work.
     It sits beside the title, and the pseudo-element gives it the 44px of
     tappable area a thumb actually needs without the box looking heavy. */
  .lang{position:relative;flex:0 0 auto;align-self:center;
    min-width:34px;min-height:30px;
    padding:0 .5rem;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--sub);font:inherit;font-size:.8125rem;
    font-weight:600;cursor:pointer}
  .lang::after{content:"";position:absolute;inset:-7px;border-radius:999px}
  .lang-row{margin-top:1.25rem}

  /* Arabic. Two things break it if left alone: the negative tracking that a
     Latin display face wants, which severs the joins between letters, and a
     line-height tuned for Latin x-height, which crowds the ascenders and
     descenders Arabic actually uses. */
  :root[dir="rtl"] body{
    font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;
    line-height:1.7}
  :root[dir="rtl"] h1,:root[dir="rtl"] .name{letter-spacing:normal}

  /* Money, phone numbers and order references are Latin-digit runs inside
     Arabic text. `plaintext` — not `isolate` — is what keeps a leading digit
     from dragging the whole run to the wrong side. */
  .num,.qty{unicode-bidi:plaintext}
  .shop{unicode-bidi:plaintext}

  /* Two screens, one header. The tabs sit where the filter chips used to be
     the only thing under the title, so they read as navigation rather than as
     another filter. */
  /* Four tabs, and the longest French label is "Transporteurs". min-width:0
     is what lets a flex item shrink below its text at all — without it the
     row overflows the header on a 360 px phone and the last tab is cut off
     the screen. The ellipsis is the floor, not the plan: the sizes below are
     chosen so nothing is actually clipped in either language. */
  /* ── Moving between sections ─────────────────────────────────────────────
   *
   * The tabs used to sit at the top of the header. A merchant works this list
   * standing up, one-handed, on a phone that is now 6.7 inches — the top of
   * the screen is the part of it a thumb cannot reach, and it held the only
   * way between the four screens.
   *
   * So navigation lives at the bottom, where the hand already is. It floats
   * above the content rather than sitting in a bar of its own, so the list
   * keeps the full height of the screen and the last card is never the one
   * hidden behind the furniture.
   *
   * Translucent: the merchant can see that there is more list underneath, so
   * the bar reads as floating over the page rather than as its end.
   */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:.5rem .75rem;
    /* The home indicator on a modern iPhone lives in this strip. Without it
       the labels sit under it and the whole bar looks mis-aligned. */
    padding-bottom:calc(.5rem + env(safe-area-inset-bottom));
    /* The padded area is not a target — only the pill itself is, or a tap
       beside the bar would be swallowed. */
    pointer-events:none}
  .tabbar__in{display:flex;gap:.125rem;max-width:25rem;margin:0 auto;
    padding:.25rem;border-radius:26px;pointer-events:auto;
    background:var(--glass);border:.5px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
    /* saturate before blur is what makes iOS material look like frosted glass
       rather than a grey sheet: colour under it bleeds through instead of
       being averaged away. */
    -webkit-backdrop-filter:saturate(180%) blur(30px);
    backdrop-filter:saturate(180%) blur(30px)}
  /* A browser without backdrop-filter would show the list straight through a
     translucent bar and make the labels unreadable, so it gets an opaque one. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .tabbar__in{background:var(--card)}
  }
  .tabbar__item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    /* 49 px including the label — the height of a real iOS tab item, and the
       same thumb target as every other control on this screen. */
    min-height:49px;padding:.3125rem .125rem;border:0;border-radius:21px;
    background:transparent;color:var(--sub);font:inherit;
    /* 10px/600 is the iOS tab label. Smaller than it looks like it should be,
       and the reason a tab bar reads as chrome rather than as content. */
    font-size:10px;font-weight:600;letter-spacing:.005em;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;transition:background-color .2s ease,color .2s ease}
  .tabbar__item svg{width:25px;height:25px;flex:0 0 auto;display:block}
  .tabbar__item span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabbar__item[aria-current="page"]{color:var(--brand-ink);
    background:var(--brand-soft)}
  /* A press should answer instantly; the transition above is for the release. */
  .tabbar__item:active{transform:scale(.94);transition:transform .08s ease}

  /* The list must be able to scroll clear of the floating bar, or its last
     row is unreachable — the one bug a floating bar always ships with. */
  body.has-tabbar main{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}

  .help{margin:0;color:var(--sub);font-size:.875rem}

  .bulk{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .bulk button{grid-column:1 / -1;min-height:44px;border:1px solid var(--line);
    border-radius:10px;background:transparent;color:var(--ink);font:inherit;
    font-size:.875rem;cursor:pointer}

  /* 16px on every input, without exception. Anything smaller and iOS zooms the
     page on focus and never zooms back — on a 58-row table that is unusable. */
  .bulk input,.rates input{min-height:44px;width:100%;padding:0 .5rem;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px;
    font-variant-numeric:tabular-nums;text-align:center}

  .rates{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:12px}
  .rates th,.rates td{padding:.375rem .5rem;text-align:start}
  /* Deliberately not sticky: the page header already is, with a higher
     stacking context, so a sticky row here would slide under it and vanish.
     The column meaning is carried by each input's aria-label anyway. */
  .rates thead th{background:var(--card);
    font-size:.75rem;font-weight:600;color:var(--sub);text-align:center;
    border-bottom:1px solid var(--line)}
  .rates thead th:first-child{text-align:start}
  .rates .cur{font-weight:400;opacity:.7}
  .rates tbody th{font-weight:400;font-size:.875rem;line-height:1.3}
  /* The table has to fit two 44px inputs and a name on a 360px screen, so the
     numeric columns are pinned and the name takes whatever is left. */
  .rates td{width:5.5rem}
  .wcode{display:inline-block;min-width:1.75rem;color:var(--sub);
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

  /* The save button follows the merchant down 58 rows instead of waiting at
     the bottom of them. */
  .savebar{position:sticky;bottom:0;padding:.625rem .75rem;
    padding-bottom:max(.625rem,env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line)}
  .savebar button{width:100%;min-height:48px;border:0;border-radius:10px;
    background:var(--ok);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .savebar button:disabled{opacity:.65}

  /* ── Carriers ─────────────────────────────────────────────────────────
     A linking form on a phone: one field per line, every control at least
     44px, and the inputs at 16px so iOS does not zoom in on focus and leave
     the merchant stranded halfway through pasting an API key. */
  .cform{display:grid;gap:.625rem;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:.875rem}
  .fld{display:grid;gap:.25rem}
  .fld span{font-size:.8125rem;color:var(--sub)}
  .fld input,.fld select{min-height:44px;width:100%;padding:0 .625rem;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--ink);font:inherit;font-size:16px}
  /* An API key is a Latin run the merchant reads character by character to
     check it; leave it to the paragraph direction and it reorders on them. */
  .fld input[type="password"],.fld input[type="url"]{direction:ltr;
    text-align:start;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:15px}

  .tog{display:flex;align-items:center;gap:.5rem;min-height:44px;
    font-size:.9375rem;cursor:pointer}
  .tog input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto}

  .frow{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .frow button{min-height:46px;border-radius:10px;font:inherit;
    font-weight:600;cursor:pointer;border:1px solid var(--line)}
  .frow .ghost{background:transparent;color:var(--ink)}
  .frow .primary{background:var(--ok);border-color:var(--ok);color:#fff}

  .addbtn{min-height:48px;border:1px dashed var(--line);border-radius:12px;
    background:transparent;color:var(--ink);font:inherit;font-weight:600;
    cursor:pointer}

  .tags{display:flex;flex-direction:column;gap:.25rem;align-items:flex-end}
  .acts--3{grid-template-columns:repeat(3,minmax(0,1fr))}

  /* The test result is the whole point of the test button, so it gets a line
     of its own rather than an alert that vanishes. */
  .testout{margin:.5rem 0 0;font-size:.8125rem;line-height:1.5;
    unicode-bidi:plaintext}
  .testout:empty{display:none}
  .testout--ok{color:var(--ok)}
  .testout--bad{color:var(--bad)}

  .ship{width:100%;min-height:46px;margin-top:.5rem;border:1px solid var(--brand-ink);
    border-radius:13px;background:transparent;color:var(--brand-ink);font:inherit;
    font-weight:600;cursor:pointer}
  .ship:disabled{opacity:.7}

  /* ── The parcel, on the order it belongs to ──────────────────────────────
     A confirmed order whose push failed is the most expensive row on this
     screen: the customer is waiting for a parcel nobody created. It gets a
     line, in colour, rather than being indistinguishable from a healthy one. */
  /* A tinted block rather than a line of text: the parcel's state is a
     different kind of fact from the address above it — it is the courier
     speaking, not the customer — and as plain text it read as one more grey
     row and wrapped into the middle of a sentence. */
  .ship-line{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center;
    margin-top:.625rem;padding:.4375rem .625rem;border-radius:11px;
    background:var(--fill);color:var(--sub);
    font-size:.8125rem;unicode-bidi:plaintext}
  .ship-line svg{width:15px;height:15px;flex:0 0 auto}
  .ship-line .num{font-variant-numeric:tabular-nums;color:inherit;
    font-weight:600}
  .ship-line--bad{background:var(--bad-bg);color:var(--bad)}
  .ship-line--ok{background:var(--ok-bg);color:var(--ok)}
  .ship-why{width:100%;line-height:1.45;unicode-bidi:plaintext}

  /* ── Statistiques ───────────────────────────────────────────────────────
     No chart library: this page is one file with no network dependency, and
     a CDN script is a blank screen the day the CDN is blocked. Bars are divs
     with a width, which is all a bar has ever been. */
  .range{display:flex;gap:.375rem;padding:0 0 .75rem;flex-wrap:wrap}
  .range button{flex:1 1 0;min-width:64px;min-height:40px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);color:var(--ink);font:inherit;
    font-size:.875rem;cursor:pointer}
  .range button[aria-pressed="true"]{background:var(--ink);color:var(--card);
    border-color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.75rem}
  .kpi__n{font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.2;unicode-bidi:plaintext}
  .kpi__l{font-size:.75rem;color:var(--soft);margin-top:.125rem}
  .kpi--wide{grid-column:1 / -1}
  .kpi--good .kpi__n{color:var(--ok)}
  .kpi--bad .kpi__n{color:var(--bad)}

  .sec{margin-top:1rem}
  .sec__h{font-size:.8125rem;font-weight:600;color:var(--soft);
    margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.04em}

  .rows{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden}
  .row{display:grid;grid-template-columns:1fr auto;gap:.125rem .5rem;
    padding:.625rem .75rem;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row__t{font-size:.875rem;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .row__n{font-size:.875rem;font-variant-numeric:tabular-nums;
    unicode-bidi:plaintext}
  .row__bar{grid-column:1 / -1;height:4px;border-radius:2px;
    background:var(--line);overflow:hidden}
  .row__bar i{display:block;height:100%;background:var(--ink)}
  .row__bar i.bad{background:var(--bad)}
  .row__sub{grid-column:1 / -1;font-size:.75rem;color:var(--soft);
    unicode-bidi:plaintext}

  /* The daily chart is read left to right in both languages: it is a time
     axis, and time does not mirror. */
  .spark{display:flex;align-items:flex-end;gap:2px;height:72px;padding:.75rem;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    direction:ltr}
  .spark i{flex:1 1 0;min-width:2px;background:var(--ink);border-radius:2px 2px 0 0;
    min-height:2px}
  .spark i.none{background:var(--line)}

  })();

  function t() { return DICT[lang]; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = t().dir;
    /* The tab is how a merchant finds this again among open tabs. */
    document.title = "MITOS — " + t().title;

  function toggleLang() {
    lang = lang === "fr" ? "ar" : "fr";
    try { localStorage.setItem(LANG, lang); } catch (e) {}

  var ORDER = ["PENDING","CONFIRMED","SHIPPED","DELIVERED","NO_ANSWER","CANCELLED","RETURNED"];
  var filter = "";
  var view = "orders";

  /* Names and addresses are typed by whoever filled the order form. They are
     escaped, not trusted, even though they came back from our own API. */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "x-mitos-key": key() }, options.headers || {}
    );
    return fetch(API + (path || ""), options);
  }

  function carrierApi(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "x-mitos-key": key() }, options.headers || {}
    );
    return fetch(CARRIERS + (path || ""), options);
  }

     words for the same view — "Commandes" is the tab, the title is the shop's

     that a new screen has to be remembered into. */
  var VIEWS = ["orders", "stats", "rates", "carriers"];
  var TAB = {
    orders: "tabOrders", stats: "tabStats",
    rates: "tabRates", carriers: "tabCarriers"

  var HEADING = {

  };

     switches the whole icon between the muted colour and the brand gradient.
     Each silhouette is deliberately unlike the others — at 23 px a merchant
     recognises the shape, not the detail. */
  var ICON_PATHS = {
    orders: '<rect x="4" y="3" width="16" height="18" rx="2.5"/>' +
            '<path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',

            '<rect x="10.2" y="6.5" width="3.6" height="11" rx="1.2"/>' +

    rates:  '<path d="M12 21.2s6.8-5.9 6.8-11.2a6.8 6.8 0 1 0-13.6 0c0 5.3 6.8 11.2 6.8 11.2z"/>' +

    return '<svg viewBox="0 0 24 24" fill="none" stroke="' +
      (active ? "url(#mitos-g)" : "currentColor") +

      'aria-hidden="true">' + ICON_PATHS[name] + "</svg>";
  }

  /* Rebuilt only when the section or the language changes — never when data
     arrives, which is what made it flicker while it lived inside #root. */
  function renderTabbar() {
    var el = document.getElementById("tabbar");
    if (!el) return;
    el.innerHTML = '<div class="tabbar__in">' +
      VIEWS.map(function (v) {
        var on = view === v;

  function setChrome(on) {

    document.body.classList.toggle("has-tabbar", on);

    return '<button class="lang" type="button" data-lang lang="' +
      (lang === "fr" ? "ar" : "fr") + '">' + t().other + "</button>";
  }

  function gate(message) {
    setChrome(false);
    root.innerHTML =
      '<form class="gate">' +
        '<img class="gate__mark" src="icons/mark.png" alt="" width="128" height="86" decoding="async">' +
        '<h1>MITOS</h1>' +
        '<p class="note" style="padding:.5rem 0">' + esc(t().ask) + "</p>" +
        '<input type="password" name="k" autocomplete="current-password" ' +
          'placeholder="' + esc(t().keyPh) + '" required>' +
        "<button type=\"submit\">" + esc(t().open) + "</button>" +
        (message ? '<p class="err">' + esc(message) + "</p>" : "") +
        '<div class="lang-row">' + langButton() + "</div>" +
      "</form>";

  function money(n, currency) {

   * exactly like one that reached the courier — and it is the most expensive

   * a generic message: "wilaya not served" and "token expired" need different
   * things done about them, and only the merchant can tell which.

    var bad = o.shipState === "FAILED";
    var label = t()["ship" + o.shipState] || o.shipState;

    return '<div class="ship-line' + (bad ? " ship-line--bad" : "") +
      (o.shipStatus === "DELIVERED" ? " ship-line--ok" : "") + '">' +

        'aria-hidden="true"><rect x="2.5" y="6.5" width="11.5" height="9.5" ' +

        '<circle cx="17.4" cy="18.2" r="1.9"/></svg>' +
      "<span>" + esc(label) + "</span>" +
      (o.carrierName ? '<span class="dot"></span><span>' + esc(o.carrierName) + "</span>" : "") +
      (o.trackingNumber
        ? '<span class="dot"></span><span class="num">' + esc(o.trackingNumber) + "</span>"
        : "") +
      (o.shipStatus && o.shipStatus !== o.status
        ? '<span class="dot"></span><span>' + esc(t()[o.shipStatus] || o.shipStatus) + "</span>"
        : "") +
      (bad && o.shipError

       is isolated — otherwise "3× قميص" reorders around the number. */
    var what = items.map(function (i) {
      return '<span class="qty">' + esc(i.qty + "× " + (i.title || t().item)) +

       A cash-on-delivery merchant is about to ring this person and, if it goes
       well, collect that amount at their door — those are the two facts the
       card is for. Place, method and order number are context, and they used
       to compete with both at the same weight. */
    return '<article class="card c-' + esc(o.status) + '" data-id="' +
        esc(o.id) + '">' +
      '<header class="card__top">' +
        '<span class="name">' + esc(o.firstName) + " " + esc(o.lastName) + "</span>" +
        '<span class="amount' + (o.pricesVerified ? "" : " amount--unsure") +
          '">' + esc(money(o.total, currency)) + "</span>" +
      "</header>" +

      '<div class="meta">' +
        '<span class="pill s-' + esc(o.status) + '" data-pill>' +
          esc(t()[o.status] || o.status) + "</span>" +
        "<span>" + esc(o.commune) + ", " + esc(o.wilayaName) + "</span>" +
        '<span class="dot"></span>' +
        "<span>" + esc(o.delivery === "DESK" ? t().desk : t().home) + "</span>" +
        (o.pricesVerified ? "" :
          '<span class="dot"></span><span class="warn">' + esc(t().unsure) + "</span>") +
        (o.shopifyName
          ? '<span class="dot"></span><span class="num">' + esc(o.shopifyName) + "</span>"
          : "") +
      "</div>" +

      (what ? '<div class="what">' + what + "</div>" : "") +
      '<div class="addr">' + esc(o.address) + "</div>" +

      (o.createFailed
        ? '<div class="fail">' + esc(t().failed) +
          esc(String(o.createError || "").slice(0, 140)) + "</div>"
        : "") +

      shipLine(o) +

      '<a class="call" href="tel:' + esc(o.phone) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ' +
          'aria-hidden="true"><path d="M6.6 3H4.5A1.5 1.5 0 0 0 3 4.6C3 12.9 ' +
          '11.1 21 19.4 21A1.5 1.5 0 0 0 21 19.5v-2.1a1 1 0 0 0-.8-1l-3.3-.7a1 ' +
          '1 0 0 0-1 .4l-.9 1.2a13.4 13.4 0 0 1-5.3-5.3l1.2-.9a1 1 0 0 0 ' +
          '.4-1l-.7-3.3a1 1 0 0 0-1-.8z"/></svg>' +
        esc(t().call) +
        '<span class="num">' + esc(o.phone) + "</span></a>" +

      '<div class="acts">' +
        ["CONFIRMED","NO_ANSWER","DELIVERED","CANCELLED"].map(function (s) {
          return '<button type="button" data-set="' + s + '"' +
            (o.status === s ? ' aria-pressed="true"' : "") + ">" +
            esc(t()[s]) + "</button>";
        }).join("") +
      "</div>" +

      /* Only once the call has gone the merchant's way. A parcel handed to a
         carrier before the customer confirms is a return the merchant pays
         for, so the button does not exist until then. */
      /* …and not once it is already there. Pushing a second time is harmless —
         the carriers function answers `duplicate` off the unique key on
         Shipment.codOrderId — but a button offering to do something that has
         been done reads as though the first attempt did not work, and a
         merchant will press it. It stays for FAILED and for QUEUED, which are
         exactly the states a retry is for. */
      (o.status === "CONFIRMED" && o.shipState !== "PUSHED"
        ? '<button type="button" class="ship" data-send="' + esc(o.id) + '">' +
          esc(t().send) + "</button>"
        : "") +
      "</article>";
  }

  function renderRates(data) {

  /**
   * Sends the whole table, not just what was touched.
   *
   * A blank field means "use the shop default", so it is left out entirely
   * rather than sent as a zero — free delivery and unset are different things,
   * and zero is the one a careless save would write.
   */
  function saveRates(btn) {
    var rates = {};
    var bad = null;

    [].forEach.call(document.querySelectorAll(".rates tbody tr"), function (tr) {
      var h = tr.querySelector('[data-rate="home"]');
      var d = tr.querySelector('[data-rate="desk"]');
      if (h.value === "" && d.value === "") return;
      var hv = Number(h.value === "" ? h.placeholder : h.value);
      var dv = Number(d.value === "" ? d.placeholder : d.value);
      if (!isFinite(hv) || !isFinite(dv) || hv < 0 || dv < 0) {
        bad = bad || (h.value !== "" && (!isFinite(hv) || hv < 0) ? h : d);
        return;
      }
      rates[tr.dataset.code] = [Math.round(hv), Math.round(dv)];
    });

    if (bad) {
      bad.focus();
      bad.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }

    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().saving;

    api("/rates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rates: rates })
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function () {
        btn.textContent = t().saved;
        setTimeout(function () {
          btn.textContent = was;
          btn.disabled = false;
        }, 1400);
      })
      .catch(function () {
        btn.textContent = was;
        btn.disabled = false;
        alert(t().saveFail);
      });
  }

  /* ── Carriers ─────────────────────────────────────────────────────────
     Kept in a variable so changing the provider in the form can redraw the
     credential fields without a round trip — each provider asks for a
     different pair, and refetching to learn that would make the select feel
     broken. */
  var carrierData = null;
  var editing = null;   // carrier id being edited, or null for a new one
  var formOpen = false;

  function providerMeta(name) {
    return ((carrierData && carrierData.providers) || []).filter(
      function (p) { return p.provider === name; }
    )[0] || { fields: [], needsBaseUrl: false };
  }

  function carrierForm() {
    var editRow = (carrierData.carriers || []).filter(function (c) {
      return c.id === editing;
    })[0] || null;

    var chosen = formOpen && formOpen !== true ? formOpen
      : editRow ? editRow.provider : "YALIDINE";
    var meta = providerMeta(chosen);

    var creds = meta.fields.map(function (f) {
      return '<label class="fld"><span>' + esc(f.label) + "</span>" +
        '<input type="password" autocomplete="new-password" ' +
          'data-cred="' + esc(f.key) + '" placeholder="' +
          (editRow && editRow.hasCredentials ? "••••••••" : "") + '"></label>';
    }).join("");

    return '<form class="cform" novalidate>' +
      '<label class="fld"><span>' + esc(t().provider) + "</span>" +
        '<select data-provider>' +
          ((carrierData.providers || []).map(function (p) {
            return '<option value="' + esc(p.provider) + '"' +
              (p.provider === chosen ? " selected" : "") + ">" +
              esc(p.provider.replace(/_/g, " ")) + "</option>";
          }).join("")) +
        "</select></label>" +

      '<label class="fld"><span>' + esc(t().carrierName) + "</span>" +
        '<input type="text" data-name value="' +
          esc(editRow ? editRow.name : "") + '"></label>' +

      (meta.needsBaseUrl
        ? '<label class="fld"><span>' + esc(t().baseUrl) + "</span>" +
          '<input type="url" inputmode="url" data-baseurl dir="ltr" ' +
            'placeholder="https://xxx.ecotrack.dz" value="' +
            esc(editRow && editRow.baseUrl ? editRow.baseUrl : "") + '"></label>'
        : "") +

      (chosen === "YALIDINE" || chosen === "NOEST"
        ? '<label class="fld"><span>' + esc(t().fromWilaya) + "</span>" +
          '<input type="text" data-fromwilaya placeholder="Alger" value="' +
            esc(editRow && editRow.fromWilaya ? editRow.fromWilaya : "") +
            '"></label>'
        : "") +

      creds +
      (meta.fields.length
        ? '<p class="help">' + esc(t().credsKept) + "</p>" : "") +

      '<label class="tog"><input type="checkbox" data-default' +
        (editRow && editRow.isDefault ? " checked" : "") + "><span>" +
        esc(t().setDefault) + "</span></label>" +
      /* The manual carrier's adapter rejects every push by definition — the
         merchant types the tracking number in themselves. Offering the switch
         would guarantee a failed shipment on every confirmation, so the
         reason is shown in its place. The server refuses it as well; this is
         only the half that stops the merchant asking. */
      (chosen === "MANUAL"
        ? '<p class="help">' + esc(t().autoOnlyApi) + "</p>"

      '<div class="frow">' +
        '<button type="button" class="ghost" data-cancel>' + esc(t().cancel) +
        "</button>" +

          esc(t().save) + "</button>" +

  function carrierCard(c) {

  function loadCarriers() {
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";
    carrierApi("")
      .then(function (r) {

        if (!r.ok) throw new Error("http-" + r.status);

      .then(renderCarriers)

  function submitCarrier(btn) {
    var form = btn.closest(".cform");
    var name = form.querySelector("[data-name]").value.trim();
    if (!name) {
      alert(t().needName);
      form.querySelector("[data-name]").focus();
      return;
    }

    /* Blank credential fields are omitted rather than sent empty, so saving a
       name or a toggle from this form never wipes a working token. */
    var creds = {};
    [].forEach.call(form.querySelectorAll("[data-cred]"), function (i) {
      if (i.value.trim()) creds[i.getAttribute("data-cred")] = i.value.trim();
    });

    var baseEl = form.querySelector("[data-baseurl]");
    var fromEl = form.querySelector("[data-fromwilaya]");

    var body = {
      id: editing || undefined,
      provider: form.querySelector("[data-provider]").value,
      name: name,
      baseUrl: baseEl ? baseEl.value.trim() : null,
      fromWilaya: fromEl ? fromEl.value.trim() : null,
      isDefault: form.querySelector("[data-default]").checked,
      /* Absent for a manual carrier, where the switch is not offered at all.
         Reading `.checked` off null would throw inside the submit handler and
         the merchant would get a button that does nothing and says nothing. */
      autoPush: !!(form.querySelector("[data-autopush]") || {}).checked
    };
    if (Object.keys(creds).length) body.credentials = creds;

    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().saving;

    carrierApi("", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); })

        formOpen = false; editing = null;
        loadCarriers();

      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = was;
        alert(t().saveFail + " (" + e.message + ")");

  /* The button that turns a documented guess into a fact. Every adapter was
     written from public documentation; this is how the merchant finds out in
     one tap whether it matched their account. */
  function runTest(btn, id) {
    var card = btn.closest(".card");
    var out = card.querySelector("[data-testout]");
    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().testing;
    out.textContent = "";

    carrierApi("/test", {
      method: "POST",

      .then(function (d) {
        out.textContent = d.detail || (d.ok ? "ok" : "");
        out.className = "testout " + (d.ok ? "testout--ok" : "testout--bad");
      })
      .catch(function () {
        out.textContent = t().offline;
        out.className = "testout testout--bad";
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = was;
      });

  function sendToCarrier(btn, orderId) {
    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().sending;

    carrierApi("/push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId: orderId })
    })
      .then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); })
      .then(function (x) {

          throw new Error(x.d.detail || x.d.error || x.r.status);

        btn.disabled = false;
        btn.textContent = was;
        alert(e.message);
      });

  function load() {
    if (!key()) return gate("");
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";

    api(filter ? "?s=" + encodeURIComponent(filter) : "")
      .then(function (r) {
        /* 404 is what a wrong key looks like: the API refuses to confirm
           that anything is there at all. */
        if (r.status === 404) throw new Error("bad-key");
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        if (e.message === "bad-key") {
          try { localStorage.removeItem(KEY); } catch (err) {}
          return gate(t().refused);
        }
        root.innerHTML = '<p class="note">' + esc(t().offline) + "</p>";
      });
  }

  /* ── Statistiques ────────────────────────────────────────────────────────
   *
   * Shopify already counts orders. What it cannot count is what a
   * cash-on-delivery shop lives on: of the orders taken, how many survived
   * the phone call and how many survived the doorstep. Shopify calls an order
   * revenue the moment it is created; here, half of those will be refused and
   * the merchant pays the return leg on every one.
   *
   * So every number on this screen is money or a decided order, never a
   * created one. `encaissé` is delivered. `perdues` is cancelled plus
   * returned. Anything still waiting for the call is counted separately and
   * never folded into a rate, or a shop that opened this morning reads as a
   * catastrophe.
   */
  var statsDays = 30;

  function loadStats() {
    root.innerHTML = '<p class="note">' + esc(t().loading) + "</p>";
    return api("/stats?days=" + statsDays)
      .then(function (r) {
        if (r.status === 404) throw new Error("bad-key");
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then(renderStats)
      .catch(function (e) {
        /* Same two outcomes as the call list, and the same words: a wrong key
           sends the merchant back to the gate, anything else is the network. */
        if (e.message === "bad-key") {
          try { localStorage.removeItem(KEY); } catch (err) {}
          return gate(t().refused);
        }
        root.innerHTML = '<p class="note">' + esc(t().offline) + "</p>";
      });
  }

  /* Null means "nothing to divide by", which is not the same claim as 0 %.
     A shop with no decided orders yet gets a dash, not a perfect score. */
  function pct(v) {
    return v == null ? "—" : Math.round(v * 100) + " %";
  }

  function kpi(n, label, tone) {
    return '<div class="kpi' + (tone ? " kpi--" + tone : "") + '">' +
      '<div class="kpi__n">' + esc(n) + "</div>" +
      '<div class="kpi__l">' + esc(label) + "</div></div>";
  }

  /* One row of a ranked list: a label, a number, and a bar that is a share of
     the biggest row rather than of the total — with a long tail, shares of the
     total are all invisible and the list stops saying anything. */
  function statRow(title, n, max, sub, lost) {
    var w = max > 0 ? Math.round((n / max) * 100) : 0;
    return '<div class="row">' +
      '<div class="row__t">' + esc(title) + "</div>" +
      '<div class="row__n">' + esc(n) + "</div>" +
      '<div class="row__bar"><i class="' + (lost ? "bad" : "") +
        '" style="width:' + w + '%"></i></div>' +
      (sub ? '<div class="row__sub">' + esc(sub) + "</div>" : "") +
      "</div>";
  }

  function section(heading, inner) {
    return '<section class="sec"><h2 class="sec__h">' + esc(heading) + "</h2>" +
      inner + "</section>";
  }

  function renderStats(data) {
    var cur = (data.shop && data.shop.currency) || "DZD";
    var T = data.totals || {};
    var M = data.money || {};

    var ranges =
      '<nav class="range">' +
        [[7, "d7"], [30, "d30"], [90, "d90"]].map(function (r) {
          return '<button type="button" data-days="' + r[0] + '"' +
            (statsDays === r[0] ? ' aria-pressed="true"' : "") + ">" +
            esc(t()[r[1]]) + "</button>";
        }).join("") +
      "</nav>";

    if (!T.orders) {
      root.innerHTML = bar(data, "") + "<main>" + ranges +
        '<p class="note">' + esc(t().noData) + "</p></main>";
      return;
    }

    var kpis = '<div class="kpis">' +
      kpi(money(M.collected || 0, cur), t().kCollected, "good") +
      kpi(money(M.inFlight || 0, cur), t().kInFlight) +
      kpi(T.orders, t().kOrders) +
      kpi(pct(T.deliveryRate), t().kDelivered, "good") +
      kpi(pct(T.lossRate), t().kLoss, "bad") +
      kpi(M.basket == null ? "—" : money(M.basket, cur), t().kBasket) +
      "</div>";

    /* The daily bars are scaled to the busiest day, and a day with no orders
       is drawn in the line colour rather than left blank — a gap in the row
       and a zero-height bar look identical, and only one of them is true. */
    var series = data.series || [];
    var peak = series.reduce(function (a, d) {
      return Math.max(a, d.orders || 0);
    }, 0);
    var spark = series.length
      ? section(t().secDaily, '<div class="spark">' +
          series.map(function (d) {
            var h = peak > 0 ? Math.round((d.orders / peak) * 100) : 0;
            return '<i class="' + (d.orders ? "" : "none") +
              '" style="height:' + Math.max(h, 3) + '%" title="' +
              esc(d.day + " · " + d.orders) + '"></i>';
          }).join("") + "</div>")
      : "";

    var wMax = (data.wilayas || []).reduce(function (a, w) {
      return Math.max(a, w.orders);
    }, 0);
    var wilayas = (data.wilayas || []).length
      ? section(t().secWilayas, '<div class="rows">' +
          data.wilayas.map(function (w) {
            return statRow(w.name || w.code, w.orders, wMax,
              w.delivered + " " + t().kDelivered + " · " +
              w.lost + " " + t().kLoss, w.lost > w.delivered);
          }).join("") + "</div>")
      : "";

    var pMax = (data.products || []).reduce(function (a, x) {
      return Math.max(a, x.orders);
    }, 0);
    var products = (data.products || []).length
      ? section(t().secProducts, '<div class="rows">' +
          data.products.map(function (x) {
            return statRow(x.title, x.orders, pMax,
              x.delivered + " " + t().kDelivered + " · " +
              x.lost + " " + t().kLoss +
              (x.revenue ? " · " + money(x.revenue, cur) : ""),
              x.lost > x.delivered);
          }).join("") + "</div>")
      : "";

    var cMax = (data.carriers || []).reduce(function (a, c) {
      return Math.max(a, c.pushed);
    }, 0);
    var carriers = (data.carriers || []).length
      ? section(t().secCarriers, '<div class="rows">' +
          data.carriers.map(function (c) {
            return statRow(c.name, c.pushed, cMax,
              c.delivered + " " + t().kDelivered + " · " +
              c.returned + " " + t().kLoss +
              (c.failed ? " · " + c.failed + " " + t().shipFAILED : ""),
              c.failed > 0);
          }).join("") + "</div>")
      : "";

    /* Goods and delivery are kept apart on purpose: the delivery fee is
       collected from the customer and handed straight to the courier, so
       folding it into revenue overstates what the merchant earned. */
    var split = section(t().secSplit, '<div class="kpis">' +
      kpi(M.home || 0, t().home) +
      kpi(M.desk || 0, t().desk) +
      kpi(money(M.goodsCollected || 0, cur), t().kGoods) +
      kpi(money(M.deliveryCollected || 0, cur), t().kShipping) +
      "</div>");

    root.innerHTML = bar(data, "") + "<main>" + ranges +
      '<p class="note" style="padding:0 0 .75rem">' + esc(t().statsHelp) + "</p>" +
      kpis + spark + wilayas + products + carriers + split +
      "</main>";
  }

  /* Ask each courier what happened to the parcels we gave it.
   *
   * Polling, because only some of this family offers webhooks and a merchant
   * should not have to know which. It is a button rather than a timer: it
   * costs a call to every courier the shop uses, and a merchant who is not
   * looking at the screen does not need it to have happened.
   */
  function runSync(btn) {
    var before = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().syncing;

    carrierApi("/sync", { method: "POST" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        btn.textContent = d && d.ok
          ? t().synced + (d.changed ? " · " + d.changed : "")
          : t().saveFail;
      })
      .catch(function () { btn.textContent = t().saveFail; })
      .then(function () {
        setTimeout(function () {
          btn.disabled = false;
          btn.textContent = before;
          /* Statuses may have moved, so the list the merchant is looking at
             is redrawn rather than left showing what it showed before. */
          show();
        }, 1400);
      });
  }

  function show() {
    if (!key()) return gate("");
    setChrome(true);
    renderTabbar();
    return view === "rates" ? loadRates()
      : view === "carriers" ? loadCarriers()
      : view === "stats" ? loadStats()
      : load();
  }

  document.addEventListener("click", function (e) {
    var range = e.target.closest("[data-days]");
    if (range) {
      statsDays = Number(range.getAttribute("data-days"));
      return loadStats();
    }

    var syncBtn = e.target.closest("[data-sync]");
    if (syncBtn) return runSync(syncBtn);

    if (e.target.closest("[data-lang]")) {
      toggleLang();
      return show();
    }

    var add = e.target.closest("[data-add]");
    if (add) { formOpen = true; editing = null; return renderCarriers(carrierData); }

    if (e.target.closest("[data-cancel]")) {
      formOpen = false; editing = null;
      return renderCarriers(carrierData);
    }

    var saveCarrierBtn = e.target.closest("[data-save-carrier]");
    if (saveCarrierBtn) return submitCarrier(saveCarrierBtn);

    var testBtn = e.target.closest("[data-test]");
    if (testBtn) return runTest(testBtn, testBtn.getAttribute("data-test"));

    var editBtn = e.target.closest("[data-edit]");
    if (editBtn) {
      editing = editBtn.getAttribute("data-edit");
      formOpen = true;
      return renderCarriers(carrierData);
    }

    var rmBtn = e.target.closest("[data-remove]");
    if (rmBtn) {
      if (!confirm(t().confirmRemove)) return;
      return carrierApi("/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: rmBtn.getAttribute("data-remove") })
      }).then(loadCarriers).catch(function () { alert(t().saveFail); });
    }

    var sendBtn = e.target.closest("[data-send]");
    if (sendBtn) return sendToCarrier(sendBtn, sendBtn.getAttribute("data-send"));

    var tab = e.target.closest("[data-view]");
    if (tab) {
      view = tab.getAttribute("data-view");
      return show();
    }

    var saveBtn = e.target.closest("[data-save-rates]");
    if (saveBtn) return saveRates(saveBtn);

    if (e.target.closest("[data-apply-all]")) {
      /* Almost every merchant charges one price everywhere and a different one
         for a handful of wilayas. Typing 58 rows to express that is the kind of
         work that stops a table from ever being filled in. */
      var h = document.getElementById("all-home").value;
      var d = document.getElementById("all-desk").value;
      [].forEach.call(document.querySelectorAll(".rates tbody tr"), function (tr) {
        if (h !== "") tr.querySelector('[data-rate="home"]').value = h;
        if (d !== "") tr.querySelector('[data-rate="desk"]').value = d;
      });
      return;
    }

    var chip = e.target.closest("[data-filter]");
    if (chip) {
      filter = chip.getAttribute("data-filter");
      return load();
    }

    var btn = e.target.closest("[data-set]");
    if (!btn) return;

    /* The status is shown as changed straight away and rolled back if the
       write fails. A merchant tapping through a call list must never be left
       unsure whether it saved. */
    var card = btn.closest(".card");
    var pill = card.querySelector("[data-pill]");
    var want = btn.getAttribute("data-set");
    var before = { text: pill.textContent, cls: pill.className,
                   card: card.className };

    card.querySelectorAll("[data-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    pill.textContent = t()[want] || want;
    pill.className = "pill s-" + want;
    /* The stripe is the thing a merchant actually reads when scanning, so it
       has to move with the badge. Leaving it on the old status would make the
       card they just marked still look unhandled. */
    card.className = "card c-" + want;

    api("", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: card.dataset.id, status: want })
    })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (d) {
        /* The server may have handed this to the courier on the way through.
           When it did, the merchant is told here rather than finding out on
           the next refresh — and when it could not, they are told that too,
           because a customer is now expecting a parcel that does not exist. */
        if (!d || !d.push) return;
        var line = document.createElement("div");
        line.className = "ship-line " +
          (d.push.ok ? "ship-line--ok" : "ship-line--bad");
        line.textContent = d.push.ok
          ? t().autoSent + (d.push.trackingNumber ? " · " + d.push.trackingNumber : "")
          : t().autoFailed + String(d.push.detail || d.push.error || "");
        var old = card.querySelector(".ship-line");
        if (old) old.replaceWith(line); else card.appendChild(line);
      })
      .catch(function () {
        pill.textContent = before.text;
        pill.className = before.cls;
        card.className = before.card;
        btn.setAttribute("aria-pressed", "false");
        alert(t().saveFail);
      });
  });

  /* The provider select changes which credentials are asked for, so the form
     is redrawn from the cached provider list rather than refetched. */
  document.addEventListener("change", function (e) {
    var sel = e.target.closest("[data-provider]");
    if (!sel || !carrierData) return;
    formOpen = sel.value;
    renderCarriers(carrierData);
  });

  applyLang();
  show();
})();
</script>

<script>
/* The service worker only makes the app open without signal — it caches the
   shell and never the orders. Registration is deliberately last and wrapped:
   a browser that does not support it, or a private window that refuses it,
   must not stop the call list from working. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* Nothing to tell the merchant. The page works either way. */
    });
  });
}
</script>
</body>
</html>
