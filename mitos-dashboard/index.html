<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101418">

<!-- Installable on a phone's home screen. The merchant works this list all
     day, standing up, and a tab among twenty tabs is not that. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MITOS">
<meta name="mobile-web-app-capable" content="yes">

<title>MITOS — Commandes</title>
<!--
  The merchant's call list, and the shipping table behind it.

  A cash-on-delivery merchant's day is a call list: ring the customer,
  confirm, hand to the courier. They do it from a phone, standing up. So this
  is one screen, one column, and every control is a thumb-sized target.

  It is a static file on purpose. It holds no secret, talks to no database,
  and needs no environment: the merchant's key lives in their own browser and
  is sent as a bearer header to the Supabase function that owns the data.
  That is why it could be deployed without anyone pasting credentials
  anywhere — which is the only reason this exists rather than the embedded
  Shopify screen in app/routes/app._index.tsx.
-->
<style>
  :root{
    /* ── The system palette ──────────────────────────────────────────────
     *
     * These are Apple's own system colours, not approximations of them. A
     * merchant runs this beside Téléphone and Réglages all day, and a screen
     * with its own idea of what grey is looks like a web page pretending to
     * be an app. The greys, the separators and the fills come from iOS; the
     * violet-to-cyan gradient stays ours, because that is the part that is
     * supposed to be different.
     *
     * The status colours are Apple's *accessible* variants, not the standard
     * ones: systemGreen on white is 2.2:1, which is fine for a filled dot and
     * unreadable as a word. These are the ones Apple ships for text.
     */
    --ink:#000; --sub:rgba(60,60,67,.6); --line:rgba(60,60,67,.18);
    --bg:#f2f2f7; --card:#fff;
    /* systemFill, the grey a segmented control's track is made of. */
    --fill:rgba(120,120,128,.12);
    --fill-2:rgba(120,120,128,.2);
    /* Status colours, chosen to sit beside a violet-to-cyan brand rather than
       against it — the previous set was a brown amber and a brick red, and a
       stripe of #a35b00 down the edge of a card reads as dirt. Each one is
       dark enough for bold small text on its own tint: measured on white at
       4.8:1 or better, which is where a status word stops being decoration
       and starts being readable. */
    --ok:#248a3d; --bad:#d70015; --warn:#c93400; --info:#0040dd;
    --ok-bg:rgba(52,199,89,.12); --bad-bg:rgba(255,59,48,.12);
    --warn-bg:rgba(255,149,0,.14); --info-bg:rgba(0,122,255,.12);
    /* A stripe is a fill, not a word. The accessible variants above are
       darkened until small bold text reads on white, which makes them muddy
       as a solid bar — #c93400 down the edge of a card looks like rust. These
       are the plain system colours, used only where nothing has to be read
       on top of them. */
    --tint-ok:#34c759; --tint-bad:#ff3b30;
    --tint-warn:#ff9500; --tint-info:#007aff;

    /* The brand, sampled from brand/mitos-mark.png rather than guessed: these
       are the two most saturated pixels at each end of the logo's gradient.
       Everything branded on this screen is one of these three tokens, so the
       app cannot drift away from the mark it ships with. */
    --brand-a:#a700ff; --brand-b:#00dfff;
    --brand:linear-gradient(120deg,var(--brand-a),var(--brand-b));
    /* A solid stand-in for the gradient, for text and icons that cannot carry
       one. Dark enough to pass contrast on white, which neither end is. */
    --brand-ink:#6d1fd6;
    --brand-soft:rgba(167,0,255,.09);

    /* The floating bar is translucent over whatever scrolls under it. */
    /* The lens is lighter than the bar it sits in, in both themes: a
       selection that is darker than its track reads as a hole. */
    --lens:rgba(255,255,255,.86);
    --lens-top:rgba(255,255,255,.9);
    --lens-bot:rgba(255,255,255,.35);
    --glass:rgba(255,255,255,.72);
    --glass-line:rgba(255,255,255,.5);
    --glass-shadow:0 10px 34px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  }
  /* ── Which theme, and who decides ────────────────────────────────────
   *
   * This was a plain prefers-color-scheme query, which means the phone
   * decides and the merchant cannot. It is keyed on an attribute now, and
   * the attribute is written by script before anything paints — so a
   * dark-mode user never sees a white flash on the way in.
   *
   * "Auto" is not a third palette: it is the absence of a stored choice.
   * The script resolves it against the system and keeps listening, so a
   * phone that switches at sunset switches this with it.
   *
   * color-scheme is what makes the parts the page does not draw — form
   * controls, scrollbars, the tap-and-hold menu — come out dark too.
   */
  :root[data-theme="dark"]{color-scheme:dark;--ink:#fff;--sub:rgba(235,235,245,.6);--line:rgba(84,84,88,.65);
      /* Apple ships two dark sets: a base one on #000 for OLED, and an
         *elevated* one a step lighter that everything presented over
         something else uses — sheets, popovers, Telegram's whole chrome. This
         app is a stack of cards on a ground, so it takes the elevated pair.
         True black made the cards look like holes cut out of the screen. */
      --bg:#1c1c1e;--card:#2c2c2e;
      --fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
      /* The mark is drawn for white. On a dark ground the violet end goes
         muddy, so the solid stand-in is lifted rather than reused. */
      --brand-ink:#c79bff; --brand-soft:rgba(167,0,255,.18);
      --lens:rgba(120,120,128,.34);
      --lens-top:rgba(255,255,255,.24);
      --lens-bot:rgba(255,255,255,.06);
      --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.10);
      --glass-shadow:0 10px 34px rgba(0,0,0,.6);
      /* Lifted for a dark ground, and the tints are near-black washes: the
         light ones would each become a glowing block on a dark card. */
      --ok:#30db5b; --bad:#ff6961; --warn:#ffb340; --info:#409cff;
      --ok-bg:rgba(48,209,88,.18); --bad-bg:rgba(255,69,58,.18);
      --warn-bg:rgba(255,159,10,.18); --info-bg:rgba(10,132,255,.18);
      --tint-ok:#30d158; --tint-bad:#ff453a;
      --tint-warn:#ff9f0a; --tint-info:#0a84ff}
  *{box-sizing:border-box}

  /* The blue that appears on every tap is Safari's, not ours: a translucent
     highlight on touch and a system focus ring after it. Both are drawn in
     the platform accent, which here sits beside a violet-to-cyan brand and
     looks like a bug. They are replaced rather than merely removed — a
     control still has to show it has focus for anyone using a keyboard. */
  button,a,select,input,textarea{-webkit-tap-highlight-color:transparent}
  button,select,.chip,.tabbar__item,.acts button,.seg__item{
    -webkit-user-select:none;user-select:none}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;
    border-radius:10px}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  /* ── The header floats too ───────────────────────────────────────────────
   *
   * It was a solid bar stuck to the top with a hairline under it, which meant
   * the list ended at a wall. It is glass now, over the list rather than
   * above it, so a merchant scrolling can see there is more underneath — the
   * same material and the same reasoning as the bar at the bottom.
   *
   * The bar itself takes no taps; only the pills inside it do. Otherwise the
   * transparent gap between them would swallow a tap meant for the card
   * showing through it.
   */
  .bar{position:fixed;top:0;inset-inline:0;z-index:30;pointer-events:none;
    padding:.5rem .75rem .375rem;
    padding-top:calc(.5rem + env(safe-area-inset-top))}
  .bar > *{pointer-events:auto}
  .bar__row{display:flex;align-items:center;gap:.5rem;margin-bottom:.375rem;
    max-width:44rem;margin-inline:auto}

  /* The screen names itself in the middle, with the one number worth knowing
     under it — how many are still waiting to be called, how long a window the
     figures cover. Centred, so the eye finds it in the same place on every
     screen, and the controls sit either side of it. */
  .bar__title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
    padding:.375rem 1rem;border-radius:999px;
    background:var(--glass);border:.5px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:saturate(180%) blur(30px);
    backdrop-filter:saturate(180%) blur(30px)}
  h1{margin:0;font-size:1.0625rem;font-weight:650;letter-spacing:-.015em;
    line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .bar__sub{font-size:.75rem;color:var(--sub);line-height:1.2;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    unicode-bidi:plaintext}

  /* The shop's own circle. Initials for now, because nothing in this system
     stores a logo yet — but the slot is the one a merchant expects to find
     theirs in, and it is the way into Réglages, which is where they would
     set it. */
  .avatar{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:50%;
    padding:0;background:var(--brand);color:#fff;font:inherit;
    font-size:.9375rem;font-weight:700;letter-spacing:.01em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px -4px rgba(167,0,255,.55)}
  .avatar:active{transform:scale(.93)}

  /* The segmented control travels with the header, on the same glass. */
  .bar .seg{max-width:44rem;margin-inline:auto;
    background:var(--glass);border:.5px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:saturate(180%) blur(30px);
    backdrop-filter:saturate(180%) blur(30px)}
  /* ── Filtering, as a segmented control ───────────────────────────────
   *
   * The filters were free-floating pills, which on a phone read as seven
   * separate buttons rather than one choice with seven answers. A segmented
   * control says it in the shape: a single track, one segment raised out of
   * it, exactly one of them true at a time.
   *
   * The track scrolls when a shop has more statuses in play than fit — the
   * alternative is segments too narrow to read, and a merchant filtering on
   * "Sans réponse" needs to see the words.
   */
  /* The curve is the one iOS uses when a sheet settles: it leaves quickly and
     arrives slowly, which reads as weight rather than as a linear slide. */
  @media (prefers-reduced-motion:reduce){
    .seg__thumb,.tabbar__thumb{transition:none}
    .seg__thumb::after,.tabbar__thumb::after{display:none}
    .seg__item:active,.tabbar__item:active{transform:none}
  }
  /* ── The selection, as a lens ────────────────────────────────────────────
   *
   * Three things separate a glass lens from a coloured rectangle, and all
   * three are what the eye is actually reading:
   *
   *   It refracts. backdrop-filter on the thumb itself means it samples and
   *   brightens what is behind it rather than covering it — a pill with a
   *   flat fill sits *on* the bar, this one sits *in* it.
   *
   *   It has a lit rim. A one-pixel inset highlight along the top edge and a
   *   fainter one along the bottom is what glass does with a light source
   *   above it, and it is the cheapest, most convincing part of the whole
   *   effect.
   *
   *   It disperses while it moves. Real glass splits light at its edges, and
   *   that fringe is only visible when the lens is travelling — so the
   *   chromatic ring below fades in for the length of the journey and back
   *   out when it lands. Left on permanently it would read as a rainbow
   *   border, which is a very different and much worse thing.
   */
  .seg__thumb,.tabbar__thumb{position:absolute;border-radius:7px;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.14),rgba(255,255,255,.04)),var(--lens);
    -webkit-backdrop-filter:blur(6px) saturate(150%) brightness(1.06);
    backdrop-filter:blur(6px) saturate(150%) brightness(1.06);
    box-shadow:inset 0 1px 0 var(--lens-top),
               inset 0 -1px 0 var(--lens-bot),
               0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.05);
    /* Transform and width travel; the dispersion fades on its own clock. */
    transition:transform .38s cubic-bezier(.32,.72,0,1),
               width .38s cubic-bezier(.32,.72,0,1)}

  /* The dispersion ring: a gradient border made by masking a filled box so
     only its 1px frame survives. */
  .seg__thumb::after,.tabbar__thumb::after{content:"";position:absolute;
    inset:0;border-radius:inherit;padding:1px;opacity:0;
    background:linear-gradient(115deg,
      rgba(167,0,255,.85),rgba(0,223,255,.85) 45%,
      rgba(255,149,0,.55) 75%,rgba(167,0,255,.7));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    transition:opacity .22s ease}
  .is-travelling.seg__thumb::after,
  .is-travelling.tabbar__thumb::after{opacity:1}
  .seg__thumb{top:2px;bottom:2px;left:0}

  /* A neutral pill. The icon already carries the gradient; a violet wash and
     a violet label on top of it made the selected tab three shades of the
     same colour and the heaviest thing on the screen. Selection is shown by
     being *stronger* — full-contrast label, plain fill — and the brand shows
     in the one place it reads as a mark rather than as decoration. */
  .tabbar__thumb{top:.25rem;bottom:.25rem;left:0;border-radius:21px}

  .seg{position:relative;display:flex;gap:2px;padding:2px;margin-bottom:.125rem;
    border-radius:9px;background:var(--fill);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .seg::-webkit-scrollbar{display:none}
  .seg__item{position:relative;z-index:1;
    flex:1 0 auto;display:inline-flex;align-items:center;
    justify-content:center;gap:.3125rem;min-height:30px;padding:0 .625rem;
    border:0;border-radius:7px;background:transparent;color:var(--ink);
    font:inherit;font-size:.8125rem;font-weight:500;white-space:nowrap;
    cursor:pointer;transition:background-color .18s ease}
  .seg__item b{font-weight:600;color:var(--sub);
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

  /* The raised look is the thumb's job now — an item that painted its own
     background would leave a second white pill behind while the first slid. */
  .seg__item[aria-pressed="true"]{font-weight:600}
  .seg__item[aria-pressed="true"] b{color:var(--brand-ink)}
  .seg__item:active{transform:scale(.96);transition:transform .08s ease}
  main{padding:.75rem;display:grid;gap:.625rem;max-width:44rem;margin:0 auto;
    padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  /* The header is out of the flow now, so the list has to be pushed clear of
     it. Its height changes with the screen — some have a segmented control,
     some do not — so it is measured after every render rather than guessed at
     with a constant that would be wrong on three screens out of four. */
  body.has-tabbar main{padding-top:var(--chrome-top,5rem)}
  /* A card, not a boxed row: the hairline border made a list of orders read as
     a table, and this is a stack of things to act on. A soft shadow lifts each
     one off the page instead. */
  .card{--accent:var(--fill-2);position:relative;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:1rem;box-shadow:0 1px 2px rgba(16,20,24,.04),
    0 6px 16px -8px rgba(16,20,24,.10)}

  /* A stripe down the leading edge in the status colour. Scrolling a list of
     forty orders, this is the only thing that can be read at a glance without
     stopping — the words all look alike at speed, the colours do not.
     inset-inline-start, so it moves to the right edge in Arabic instead of
     sitting on the wrong side of every card. */
  .card::before{content:"";position:absolute;top:0;bottom:0;
    inset-inline-start:0;width:3px;background:var(--accent)}
  /* Amber is the order that still needs the merchant to do something; blue is
     the one already moving. That was the wrong way round — a confirmed order
     was flagged in warning orange while an uncalled one sat in calm blue,
     which is exactly backwards for a screen whose whole job is "who do I ring
     next". */
  .c-PENDING,.c-NO_ANSWER{--accent:var(--tint-warn)}
  .c-CONFIRMED,.c-SHIPPED{--accent:var(--tint-info)}
  .c-DELIVERED{--accent:var(--tint-ok)}
  .c-CANCELLED,.c-RETURNED{--accent:var(--tint-bad)}

  .card__top{display:flex;justify-content:space-between;align-items:baseline;
    gap:.75rem}
  .name{font-weight:650;letter-spacing:-.01em;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  /* The money, given the size it deserves. This is a cash-on-delivery shop:
     the amount is what the merchant will be handed at the door, and it used
     to sit in the middle of a grey row between the delivery method and the
     order number, at the same weight as both. */
  .amount{flex:0 0 auto;font-size:1.125rem;font-weight:700;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    unicode-bidi:plaintext}
  .amount--unsure{color:var(--warn)}

  .pill{flex:0 0 auto;font-size:.75rem;font-weight:600;padding:.1875rem .5rem;
    border-radius:999px;background:var(--fill);color:var(--sub)}
  /* The badge follows the stripe, or a card says two things at once. */
  .s-PENDING{background:var(--warn-bg);color:var(--warn)}
  .s-NO_ANSWER{background:var(--warn-bg);color:var(--warn)}
  .s-CONFIRMED,.s-SHIPPED{background:var(--info-bg);color:var(--info)}
  .s-DELIVERED{background:var(--ok-bg);color:var(--ok)}
  .s-CANCELLED,.s-RETURNED{background:var(--bad-bg);color:var(--bad)}
  .meta{display:flex;align-items:center;gap:.375rem .5rem;flex-wrap:wrap;
    margin-top:.375rem;font-size:.8125rem;color:var(--sub)}
  .num{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;
    unicode-bidi:plaintext}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--fill-2);
    flex:0 0 auto}
  .warn{color:var(--warn);font-weight:600}
  .what,.addr{margin-top:.375rem;font-size:.875rem}
  .addr{color:var(--sub)}
  .fail{margin-top:.5rem;padding:.5rem .625rem;border-radius:11px;
    background:var(--bad-bg);color:var(--bad);font-size:.8125rem}
  /* gap, not a space in the markup: the label and the number are two flex
     children and the whitespace between them is discarded, which is why this
     read "Appeler0770889900" for as long as the button has existed. */
  /* The one action this whole screen exists for, so it carries the brand
     rather than a generic green. The handset says "call"; the colour says
     whose app this is. */
  .call{display:flex;align-items:center;justify-content:center;gap:.5rem;
    min-height:50px;
    margin-top:.75rem;border-radius:13px;background:var(--brand);color:#fff;
    font-weight:600;text-decoration:none;unicode-bidi:plaintext;
    box-shadow:0 6px 16px -6px rgba(167,0,255,.5)}
  .call svg{width:18px;height:18px;flex:0 0 auto}
  /* .num paints itself var(--ink) everywhere else on the card, which on this
     button meant a near-black phone number on a saturated ground. The number
     is part of the label here, so it takes the label's colour. */
  .call .num{color:inherit}
  .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.375rem;
    margin-top:.625rem}
  .acts button{min-height:44px;border:1px solid var(--line);
    background:transparent;border-radius:10px;font:inherit;font-size:.875rem;
    color:var(--ink);cursor:pointer}
  /* The chosen status wears its own colour. It used to wear the brand, so a
     cancelled order showed a red stripe, a red badge and a violet button —
     three things describing one fact in two colours. The brand is for
     navigation and for the action; a status is never the brand. */
  .acts button[aria-pressed="true"]{font-weight:600}
  .acts button[aria-pressed="true"][data-set="CONFIRMED"],
  .acts button[aria-pressed="true"][data-set="SHIPPED"]{
    border-color:var(--info);background:var(--info-bg);color:var(--info)}
  .acts button[aria-pressed="true"][data-set="DELIVERED"]{
    border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .acts button[aria-pressed="true"][data-set="NO_ANSWER"]{
    border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .acts button[aria-pressed="true"][data-set="CANCELLED"],
  .acts button[aria-pressed="true"][data-set="RETURNED"]{
    border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .note{padding:2.5rem 1.25rem;text-align:center;color:var(--sub)}
  form.gate{max-width:22rem;margin:15vh auto;padding:0 1.25rem;text-align:center}
  /* alt="" on purpose: the <h1> underneath already says MITOS, and a
     screen reader announcing it twice is noise, not information. */
  form.gate .gate__mark{display:block;margin:0 auto .5rem;height:auto}
  form.gate input{width:100%;min-height:48px;margin-top:1rem;padding:0 .75rem;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px}
  form.gate button{width:100%;min-height:48px;margin-top:.625rem;border:0;
    border-radius:10px;background:var(--ink);color:var(--card);font:inherit;
    font-weight:600;cursor:pointer}
  .err{color:var(--bad);font-size:.875rem;margin-top:.75rem}

  /* The language switch: a chip, not a control that competes with the work.
     It sits beside the title, and the pseudo-element gives it the 44px of
     tappable area a thumb actually needs without the box looking heavy. */
  .lang{position:relative;flex:0 0 auto;align-self:center;
    min-width:34px;min-height:30px;
    padding:0 .5rem;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--sub);font:inherit;font-size:.8125rem;
    font-weight:600;cursor:pointer}
  .lang::after{content:"";position:absolute;inset:-7px;border-radius:999px}
  .lang-row{margin-top:1.25rem}

  /* Arabic. Two things break it if left alone: the negative tracking that a
     Latin display face wants, which severs the joins between letters, and a
     line-height tuned for Latin x-height, which crowds the ascenders and
     descenders Arabic actually uses. */
  :root[dir="rtl"] body{
    font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;
    line-height:1.7}
  :root[dir="rtl"] h1,:root[dir="rtl"] .name{letter-spacing:normal}

  /* Money, phone numbers and order references are Latin-digit runs inside
     Arabic text. `plaintext` — not `isolate` — is what keeps a leading digit
     from dragging the whole run to the wrong side. */
  .num,.qty{unicode-bidi:plaintext}
  .shop{unicode-bidi:plaintext}

  /* Two screens, one header. The tabs sit where the filter chips used to be
     the only thing under the title, so they read as navigation rather than as
     another filter. */
  /* Four tabs, and the longest French label is "Transporteurs". min-width:0
     is what lets a flex item shrink below its text at all — without it the
     row overflows the header on a 360 px phone and the last tab is cut off
     the screen. The ellipsis is the floor, not the plan: the sizes below are
     chosen so nothing is actually clipped in either language. */
  /* ── Moving between sections ─────────────────────────────────────────────
   *
   * The tabs used to sit at the top of the header. A merchant works this list
   * standing up, one-handed, on a phone that is now 6.7 inches — the top of
   * the screen is the part of it a thumb cannot reach, and it held the only
   * way between the four screens.
   *
   * So navigation lives at the bottom, where the hand already is. It floats
   * above the content rather than sitting in a bar of its own, so the list
   * keeps the full height of the screen and the last card is never the one
   * hidden behind the furniture.
   *
   * Translucent: the merchant can see that there is more list underneath, so
   * the bar reads as floating over the page rather than as its end.
   */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:.5rem .75rem;
    /* The home indicator on a modern iPhone lives in this strip. Without it
       the labels sit under it and the whole bar looks mis-aligned. */
    padding-bottom:calc(.5rem + env(safe-area-inset-bottom));
    /* The padded area is not a target — only the pill itself is, or a tap
       beside the bar would be swallowed. */
    pointer-events:none}
  .tabbar__in{position:relative;display:flex;gap:.125rem;max-width:25rem;margin:0 auto;
    padding:.25rem;border-radius:26px;pointer-events:auto;
    background:var(--glass);border:.5px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
    /* saturate before blur is what makes iOS material look like frosted glass
       rather than a grey sheet: colour under it bleeds through instead of
       being averaged away. */
    -webkit-backdrop-filter:saturate(180%) blur(30px);
    backdrop-filter:saturate(180%) blur(30px)}
  /* A browser without backdrop-filter would show the list straight through a
     translucent bar and make the labels unreadable, so it gets an opaque one. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .tabbar__in{background:var(--card)}
  }
  .tabbar__item{position:relative;z-index:1;
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    /* 49 px including the label — the height of a real iOS tab item, and the
       same thumb target as every other control on this screen. */
    min-height:49px;padding:.3125rem .125rem;border:0;border-radius:21px;
    background:transparent;color:var(--sub);font:inherit;
    /* 10px/600 is the iOS tab label. Smaller than it looks like it should be,
       and the reason a tab bar reads as chrome rather than as content. */
    font-size:10px;font-weight:600;letter-spacing:.005em;
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;transition:background-color .2s ease,color .2s ease}
  .tabbar__item svg{width:25px;height:25px;flex:0 0 auto;display:block}

  /* How many orders are still waiting for a call, on the tab that holds
     them. A merchant who has the figures open should not have to go back to
     the list to find out whether there is anything to do — and this is the
     one number in the app that means "your day is not finished". */
  .tabbar__icon{position:relative;display:block}
  .tabbar__badge{position:absolute;top:-4px;inset-inline-start:14px;
    min-width:17px;height:17px;padding:0 4px;border-radius:999px;
    background:var(--tint-bad);color:#fff;
    font-size:10px;font-weight:700;line-height:17px;text-align:center;
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext;
    box-shadow:0 0 0 2px var(--glass)}
  .tabbar__item span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabbar__item[aria-current="page"]{color:var(--ink)}
  /* A press should answer instantly; the transition above is for the release. */
  .tabbar__item:active{transform:scale(.94);transition:transform .08s ease}

  /* The list must be able to scroll clear of the floating bar, or its last
     row is unreachable — the one bug a floating bar always ships with. */
  body.has-tabbar main{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}

  .help{margin:0;color:var(--sub);font-size:.875rem}

  .bulk{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .bulk button{grid-column:1 / -1;min-height:44px;border:1px solid var(--line);
    border-radius:10px;background:transparent;color:var(--ink);font:inherit;
    font-size:.875rem;cursor:pointer}

  /* 16px on every input, without exception. Anything smaller and iOS zooms the
     page on focus and never zooms back — on a 58-row table that is unusable. */
  .bulk input,.rates input{min-height:44px;width:100%;padding:0 .5rem;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--ink);font:inherit;font-size:16px;
    font-variant-numeric:tabular-nums;text-align:center}

  .rates{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:12px}
  .rates th,.rates td{padding:.375rem .5rem;text-align:start}
  /* Deliberately not sticky: the page header already is, with a higher
     stacking context, so a sticky row here would slide under it and vanish.
     The column meaning is carried by each input's aria-label anyway. */
  .rates thead th{background:var(--card);
    font-size:.75rem;font-weight:600;color:var(--sub);text-align:center;
    border-bottom:1px solid var(--line)}
  .rates thead th:first-child{text-align:start}
  .rates .cur{font-weight:400;opacity:.7}
  .rates tbody th{font-weight:400;font-size:.875rem;line-height:1.3}
  /* The table has to fit two 44px inputs and a name on a 360px screen, so the
     numeric columns are pinned and the name takes whatever is left. */
  .rates td{width:5.5rem}
  .wcode{display:inline-block;min-width:1.75rem;color:var(--sub);
    font-variant-numeric:tabular-nums;unicode-bidi:plaintext}

  /* The save button follows the merchant down 58 rows instead of waiting at
     the bottom of them. */
  /* Above the tab bar, not under it. At bottom:0 this sat behind the floating
     bar: the merchant could not press Enregistrer, and its green bled up
     through the glass and turned the whole tab bar green. */
  .savebar{position:sticky;bottom:0;z-index:10;padding:.625rem 0 0;
    background:transparent;border-top:0}
  body.has-tabbar .savebar{bottom:calc(4.5rem + env(safe-area-inset-bottom))}
  .savebar button{width:100%;min-height:50px;border:0;border-radius:13px;
    background:var(--brand);color:#fff;font:inherit;font-weight:600;
    cursor:pointer;box-shadow:0 8px 24px -8px rgba(167,0,255,.6)}
  .savebar button:disabled{opacity:.65}

  /* ── Carriers ─────────────────────────────────────────────────────────
     A linking form on a phone: one field per line, every control at least
     44px, and the inputs at 16px so iOS does not zoom in on focus and leave
     the merchant stranded halfway through pasting an API key. */
  .cform{display:grid;gap:.625rem;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:.875rem}
  .fld{display:grid;gap:.25rem}
  .fld span{font-size:.8125rem;color:var(--sub)}
  .fld input,.fld select{min-height:44px;width:100%;padding:0 .625rem;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--ink);font:inherit;font-size:16px}
  /* An API key is a Latin run the merchant reads character by character to
     check it; leave it to the paragraph direction and it reorders on them. */
  .fld input[type="password"],.fld input[type="url"]{direction:ltr;
    text-align:start;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:15px}

  .tog{display:flex;align-items:center;gap:.5rem;min-height:44px;
    font-size:.9375rem;cursor:pointer}
  .tog input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto}

  .frow{display:grid;grid-template-columns:1fr 1fr;gap:.375rem}
  .frow button{min-height:46px;border-radius:10px;font:inherit;
    font-weight:600;cursor:pointer;border:1px solid var(--line)}
  .frow .ghost{background:transparent;color:var(--ink)}
  .frow .primary{background:var(--ok);border-color:var(--ok);color:#fff}

  .addbtn{min-height:48px;border:1px dashed var(--line);border-radius:12px;
    background:transparent;color:var(--ink);font:inherit;font-weight:600;
    cursor:pointer}

  .tags{display:flex;flex-direction:column;gap:.25rem;align-items:flex-end}
  .acts--3{grid-template-columns:repeat(3,minmax(0,1fr))}

  .secondary{width:100%;min-height:46px;margin-top:.625rem;
    border:1px solid var(--line);border-radius:13px;background:transparent;
    color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  .secondary:active{background:var(--fill)}
  .secondary:disabled{opacity:.6}

  /* A carrier's attributes are not statuses. "Par défaut" in delivered-green
     and "Envoi automatique" in confirmed-blue borrowed two meanings that
     belong to orders, and on a screen with no orders on it they read as
     states that something had reached. */
  .tag{font-size:.75rem;font-weight:600;padding:.1875rem .5rem;
    border-radius:999px;background:var(--fill);color:var(--sub)}
  .tag--on{background:var(--brand-soft);color:var(--brand-ink)}

  /* ── The menu ────────────────────────────────────────────────────────────
   *
   * Three buttons for three rare actions gave a carrier card a row of
   * furniture as heavy as the card itself. Test, rename and delete are
   * things a merchant does once and then not again for months, so they live
   * behind one dot-dot-dot — which is where iOS has trained everyone to look
   * for exactly this kind of list.
   *
   * It grows out of the corner it was opened from rather than fading in
   * place: an origin is what tells the eye which control produced it, and
   * without one a menu reads as a dialogue that arrived on its own.
   */
  .kebab{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;
    padding:0;background:transparent;color:var(--sub);cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .kebab:active{background:var(--fill)}
  .kebab svg{width:20px;height:20px}

  .menu{position:fixed;z-index:60;min-width:13rem;max-width:min(18rem,86vw);
    padding:.25rem;border-radius:14px;
    background:var(--glass);border:.5px solid var(--glass-line);
    box-shadow:0 12px 40px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.16);
    -webkit-backdrop-filter:saturate(180%) blur(30px);
    backdrop-filter:saturate(180%) blur(30px);
    opacity:0;transform:scale(.86);transform-origin:var(--from,100% 0);
    transition:opacity .18s ease,transform .26s cubic-bezier(.32,.72,0,1)}
  .menu.is-open{opacity:1;transform:scale(1)}

  .menu button{display:flex;align-items:center;gap:.75rem;width:100%;
    min-height:44px;padding:0 .75rem;border:0;border-radius:11px;
    background:transparent;color:var(--ink);font:inherit;font-size:.9375rem;
    text-align:start;cursor:pointer}
  .menu button:active{background:var(--fill)}
  .menu button svg{width:19px;height:19px;flex:0 0 auto;opacity:.85}
  .menu hr{margin:.1875rem .5rem;border:0;border-top:.5px solid var(--line)}
  .menu .danger{color:var(--bad)}

  /* The test result is the whole point of the test button, so it gets a line
     of its own rather than an alert that vanishes. */
  .testout{margin:.5rem 0 0;font-size:.8125rem;line-height:1.5;
    unicode-bidi:plaintext}
  .testout:empty{display:none}
  .testout--ok{color:var(--ok)}
  .testout--bad{color:var(--bad)}

  /* Neutral. It is the rarer action and it sits directly under the gradient
     call button — in the brand colour there were two violet buttons stacked,
     and the eye could not tell which one the card was for. */
  .ship{width:100%;min-height:46px;margin-top:.5rem;border:1px solid var(--line);
    border-radius:13px;background:transparent;color:var(--ink);font:inherit;
    font-weight:600;cursor:pointer}
  .ship:active{background:var(--fill)}
  .ship:disabled{opacity:.7}

  /* ── The way in ──────────────────────────────────────────────────────────
   *
   * The sign-in buttons are drawn to each platform's own guidelines — Apple
   * black, Google white with its hairline, Facebook #1877F2 — because a
   * merchant recognises those before they read them, and a home-made
   * approximation of them reads as a phishing page.
   *
   * They are visibly not ready. A button that looks live and does nothing is
   * the worst thing on a sign-in screen; these carry a "bientôt" badge and
   * say what is missing when pressed, and the key field beneath them is the
   * path that actually works today.
   */
  /* Centred while it fits, scrolled from the top once it does not — with
     plain centring a screen one line too tall clips the logo off the top and
     there is no way to scroll back up to it. */
  .signin{max-width:22rem;margin:0 auto;
    padding:calc(.75rem + env(safe-area-inset-top)) 1.25rem
      calc(.75rem + env(safe-area-inset-bottom));
    min-height:100svh;display:flex;flex-direction:column;
    justify-content:safe center;gap:.4375rem}
  .signin__mark,.orbit__mark{display:block;height:auto}

  /* ── The constellation ───────────────────────────────────────────────────
   *
   * Built from CSS and inline SVG rather than a video or a Lottie file, for
   * the same reason this page has no CDN script: a hero that arrives over the
   * network is a blank rectangle the day the network is slow, and this is the
   * first thing a merchant ever sees. It is also a few hundred bytes instead
   * of a few hundred kilobytes, stays sharp at any density, and follows the
   * theme — none of which a video does.
   *
   * Two rings turning at different speeds and in opposite directions. One
   * ring alone reads as a loading spinner; two reading against each other
   * read as a system with things moving through it, which is what this is.
   */
  .orbit{position:relative;width:min(62vw,26vh,208px);aspect-ratio:1;
    margin:0 auto;display:grid;place-items:center}

  /* The glow is what stops the tiles looking like stickers on a flat page. */
  .orbit__glow{position:absolute;inset:12%;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,
      rgba(167,0,255,.32),rgba(0,223,255,.14) 45%,transparent 70%);
    filter:blur(14px)}
  .orbit__rings{position:absolute;inset:0;color:var(--brand-ink);opacity:.28}

  .orbit__spin{position:absolute;inset:0;animation:orbit-spin 46s linear infinite}
  .orbit__spin--b{animation-duration:34s;animation-direction:reverse}

  /* Each tile sits at its own angle on its own radius: rotate out to the
     angle, translate along it, then rotate back so the icon is upright at
     rest. The spin-back animation keeps it upright while the ring turns —
     the static counter-rotation alone cannot cancel a moving parent. */
  .orbit__tile{position:absolute;top:50%;left:50%;width:38px;height:38px;
    margin:-19px 0 0 -19px;display:grid;place-items:center;
    border-radius:13px;background:var(--glass);
    border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    backdrop-filter:saturate(180%) blur(12px);
    transform:rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a)));
    animation:orbit-upright 46s linear infinite}
  .orbit__spin--b .orbit__tile{animation-duration:34s;
    animation-direction:normal}
  .orbit__spin--b{--dir:reverse}
  .orbit__tile svg{width:19px;height:19px;color:var(--brand-ink)}

  .orbit__mark{position:relative;z-index:1;width:46%;height:auto;
    filter:drop-shadow(0 8px 24px rgba(167,0,255,.45))}

  @keyframes orbit-spin{to{transform:rotate(360deg)}}
  /* Upright means "undo whatever the ring has done so far", so this is the
     same rotation played backwards, at the same speed. */
  @keyframes orbit-upright{
    from{transform:rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a)))}
    to{transform:rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a) - 360deg))}
  }

  /* Motion that never stops is the kind that makes people put a phone down.
     The arrangement is the point; the turning is the flourish. */
  @media (prefers-reduced-motion:reduce){
    .orbit__spin,.orbit__tile{animation:none}
  }
  /* Three lines, the second and third in the mark's own gradient. It is the
     one place on the screen where the brand is allowed to be decorative,
     because it is the only place with nothing to do. */
  .signin__pitch{margin:.25rem 0 0;text-align:center;
    font-size:clamp(1.25rem,4.6vw,1.5rem);font-weight:700;
    letter-spacing:-.022em;line-height:1.2}
  .signin__pitch span{display:block;background:var(--brand);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  /* A gradient clipped to text has no colour of its own if the clip is not
     supported, so the fallback is the solid stand-in rather than nothing. */
  @supports not ((-webkit-background-clip:text) or (background-clip:text)){
    .signin__pitch span{color:var(--brand-ink);background:none}
  }
  .signin__sub{margin:.375rem 0 .75rem;text-align:center;color:var(--sub);
    font-size:.8125rem;line-height:1.4}

  /* The label is centred and the badge is taken out of the flow, so a long
     translation ("Continuer avec Facebook") stays on one line instead of
     wrapping into a two-line button. */
  .sso{position:relative;display:flex;align-items:center;
    gap:.625rem;width:100%;min-height:50px;padding:0 1rem;border-radius:14px;
    border:1px solid transparent;font:inherit;font-size:.9375rem;
    font-weight:600;white-space:nowrap;cursor:pointer}
  /* The label takes the middle and the chevron sits at the end, so the row
     reads icon → what it does → where it goes. */
  .sso__l{flex:1 1 auto;text-align:start;overflow:hidden;
    text-overflow:ellipsis}
  .sso__go{width:16px;height:16px;flex:0 0 auto;opacity:.5}
  /* The chevron points the way out of the screen, so it turns around with the
     screen. */
  [dir="rtl"] .sso__go{transform:scaleX(-1)}
  .sso svg{width:19px;height:19px;flex:0 0 auto}
  .sso--apple{background:#000;color:#fff}
  .sso--google{background:#fff;color:#1f1f1f;border-color:#dadce0}
  /* Shopify's own surface: their green bag on a neutral card, which is how it
     appears in their own product. */
  .sso--shopify{background:var(--card);color:var(--ink);border-color:var(--line)}
  /* Their brands do not follow our theme: Apple's button is black on a dark
     screen too, and Google's stays white. Only the hairline is lifted so the
     white button does not float edgeless on black. */
  :root[data-theme="dark"] .sso--apple{background:#fff;color:#000}
  /* Google ships a dark variant and this is it — #131314 with their grey
     hairline. Keeping the white button on a black screen would be the one
     thing on the page bright enough to read as an alert. */
  :root[data-theme="dark"] .sso--google{background:#131314;color:#e3e3e3;
    border-color:#8e918f}
  .sso:active{transform:scale(.985)}
  /* One line under the group rather than a badge on each button: an absolutely
     positioned badge sat on top of a centred label, and reserving room for it
     on every button would have squeezed the longest translation instead. */
  .signin__soon{margin:.125rem 0 0;text-align:center;color:var(--sub);
    font-size:.75rem;line-height:1.4}

  .signin__or{display:flex;align-items:center;gap:.75rem;margin:.25rem 0;
    color:var(--sub);font-size:.8125rem}
  .signin__or::before,.signin__or::after{content:"";flex:1 1 0;height:1px;
    background:var(--line)}
  .signin__trust{display:flex;align-items:center;justify-content:center;
    gap:.4375rem;margin:.875rem 0 0;color:var(--sub);font-size:.75rem;
    text-align:center;line-height:1.45}
  .signin__trust svg{width:16px;height:16px;flex:0 0 auto;
    color:var(--brand-ink)}
  /* The consent sentence lives with the language row now, one line, so the
     screen ends on something a merchant might act on rather than on two
     stacked paragraphs of grey they will both skip. */
  .signin__legal{margin:.375rem 0 0;text-align:center;color:var(--sub);
    font-size:.6875rem;line-height:1.4;opacity:.75}

  /* The key form predates this screen and brought its own centring, its own
     15vh margin and a full-width black button that competed with Apple's for
     the same attention. Inside the sign-in screen it is a field and a
     secondary action. */
  .signin .gate{margin:0;padding:0;max-width:none;display:grid;gap:.5rem}
  .signin .gate input{margin:0;min-height:50px;border-radius:13px}
  /* The brand goes on the path that works. The three above carry their
     owners' colours and are not ready; this one opens the app. */
  .signin .gate button[type="submit"]{margin:0;min-height:50px;
    border-radius:13px;background:var(--brand);color:#fff;
    box-shadow:0 6px 16px -6px rgba(167,0,255,.5)}
  .signin .lang-row{display:flex;justify-content:center;gap:.5rem;
    margin-top:.75rem}
  .signin .lang{min-height:34px;padding:0 .875rem;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--sub);
    font:inherit;font-size:.8125rem;cursor:pointer}
  .signin .lang[aria-pressed="true"]{border-color:var(--brand-ink);
    color:var(--brand-ink);font-weight:600;background:var(--brand-soft)}

  /* ── Réglages, as a sheet ────────────────────────────────────────────────
   *
   * Settings is not a fifth destination. A tab bar is for the places a
   * merchant works, and this is a drawer they open, change one thing in, and
   * close — so it arrives over the list rather than replacing it, and the
   * list is still visibly there behind it.
   *
   * It is dismissed by the backdrop, by the button, and by Escape. A sheet
   * with only one way out is a sheet people feel trapped in.
   */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);
    opacity:0;transition:opacity .3s ease;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--bg);border-radius:14px 14px 0 0;
    padding:0 1rem calc(1.5rem + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .42s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -8px 40px rgba(0,0,0,.22)}
  body.sheet-open .scrim{opacity:1}
  body.sheet-open .sheet{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){
    .scrim,.sheet{transition:none}
  }

  /* The grabber: the one piece of chrome that tells a phone user this can be
     pulled down, before they have tried anything. */
  .sheet__grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);
    margin:.5rem auto .25rem}
  .sheet__top{position:sticky;top:0;z-index:1;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;
    gap:.5rem;padding:.25rem 0 .75rem}
  .sheet__top h2{margin:0;font-size:1.375rem;font-weight:700;
    letter-spacing:-.02em}
  .sheet__done{border:0;background:transparent;color:var(--brand-ink);
    font:inherit;font-size:1rem;font-weight:600;cursor:pointer;padding:.25rem}

  /* iOS inset-grouped rows: a titled group of a rounded card, hairlines
     between rows and none at the ends. */
  .grp{margin:1.25rem 0 0}
  .grp__h{margin:0 0 .5rem .875rem;font-size:.8125rem;color:var(--sub);
    text-transform:uppercase;letter-spacing:.05em}
  .grp__body{background:var(--card);border-radius:12px;overflow:hidden}
  .row2{display:flex;align-items:center;gap:.75rem;min-height:48px;
    padding:.625rem .875rem;border-bottom:.5px solid var(--line)}

    overflow-wrap:anywhere;unicode-bidi:plaintext}
  .row2__v{flex:0 0 auto;color:var(--sub);font-size:.9375rem;
    unicode-bidi:plaintext}
  button.row2{width:100%;border:0;background:transparent;color:var(--ink);
    font:inherit;text-align:start;cursor:pointer;
    border-bottom:.5px solid var(--line)}
  button.row2:last-child{border-bottom:0}
  button.row2:active{background:var(--fill)}
  .row2--danger .row2__t{color:var(--bad);font-weight:600}
  .row2__check{flex:0 0 auto;color:var(--brand-ink);font-weight:700}

  .row2 .seg{flex:0 0 auto;margin:0;min-width:9.5rem}
  .row2 .seg__item{font-size:.75rem;min-height:26px;padding:0 .5rem}

     A confirmed order whose push failed is the most expensive row on this
     screen: the customer is waiting for a parcel nobody created. It gets a
     line, in colour, rather than being indistinguishable from a healthy one. */
  /* A tinted block rather than a line of text: the parcel's state is a
     different kind of fact from the address above it — it is the courier
     speaking, not the customer — and as plain text it read as one more grey
     row and wrapped into the middle of a sentence. */
  .ship-line{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center;

     a CDN script is a blank screen the day the CDN is blocked. Bars are divs
     with a width, which is all a bar has ever been. */

  .range button{flex:1 1 0;min-width:64px;min-height:40px;border:1px solid var(--line);

  .kpi__n{font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.2;unicode-bidi:plaintext}
  .kpi__l{font-size:.75rem;color:var(--soft);margin-top:.125rem}
  .kpi--wide{grid-column:1 / -1}

  .kpi--bad .kpi__n{color:var(--bad)}

    margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.04em}

  .rows{background:var(--card);border:1px solid var(--line);border-radius:12px;

  .row{display:grid;grid-template-columns:1fr auto;gap:.125rem .5rem;
    padding:.625rem .75rem;border-bottom:1px solid var(--line)}

  .row__t{font-size:.875rem;min-width:0;overflow:hidden;text-overflow:ellipsis;

  .row__n{font-size:.875rem;font-variant-numeric:tabular-nums;

  .row__bar{grid-column:1 / -1;height:4px;border-radius:2px;
    background:var(--line);overflow:hidden}
  .row__bar i{display:block;height:100%;background:var(--ink)}

     axis, and time does not mirror. */

     zero-height bar look identical, and only one of them is true. */
  .spark i.none{background:var(--fill-2)}

          "<span>" + esc(t()[TAB[v]]) + "</span></button>";

       attribute, not something CSS can switch — so the bar is rebuilt and the
       thumb has to be re-placed. It still animates: the transition runs from
       whatever transform the previous thumb had, which is why the position is
       carried over rather than left at zero. */

    var thumb = track.querySelector(".tabbar__thumb");
    if (!first && lastTab) thumb.style.transform = lastTab;

    var thumb = track.querySelector(".tabbar__thumb");

    var a = on.getBoundingClientRect();

    var wasAt = lastTab ? parseFloat(lastTab.replace(/[^\d.-]/g, "")) : x;

    thumb.style.width = a.width + "px";

       one is set, or the browser collapses both into a single style change

          '11.1 21 19.4 21A1.5 1.5 0 0 0 21 19.5v-2.1a1 1 0 0 0-.8-1l-3.3-.7a1 ' +
          '1 0 0 0-1 .4l-.9 1.2a13.4 13.4 0 0 1-5.3-5.3l1.2-.9a1 1 0 0 0 ' +
          '.4-1l-.7-3.3a1 1 0 0 0-1-.8z"/></svg>' +

        ["CONFIRMED","NO_ANSWER","DELIVERED","CANCELLED"].map(function (s) {

            (o.status === s ? ' aria-pressed="true"' : "") + ">" +
            esc(t()[s]) + "</button>";
        }).join("") +

      /* Only once the call has gone the merchant's way. A parcel handed to a
         carrier before the customer confirms is a return the merchant pays

      /* …and not once it is already there. Pushing a second time is harmless —
         the carriers function answers `duplicate` off the unique key on
         Shipment.codOrderId — but a button offering to do something that has
         been done reads as though the first attempt did not work, and a
         merchant will press it. It stays for FAILED and for QUEUED, which are

      (o.status === "CONFIRMED" && o.shipState !== "PUSHED"

  function render(data) {

       is kept from the last answer rather than asked for again when the sheet
       is opened. */
    sheetShop = (data.shop && data.shop.domain) || sheetShop;
    var counts = data.counts || {};
    var waiting = (counts.PENDING || 0) + (counts.NO_ANSWER || 0);

      waitingCount = waiting;

    /* Keyed on which segments exist and what they count — never on the
       rendered markup, which carries the pressed state and would make every

    bar(data,
        '<nav class="seg"><span class="seg__thumb" aria-hidden="true"></span>' +
          chips + "</nav>",

  /* The header is identical on both screens, so it is built once — the tabs
     are the only way between them and must not move or change shape when the
     screen does. */
  /* What the header currently shows. Rebuilding it on every data load would
     reset the thumb mid-slide, so it is rebuilt only when something in it has
     actually changed — the section, the language, or the counts. */
  var barKey = null;

  function bar(data, below, key) {
    var el = document.getElementById("topbar");
    var full = view + "|" + lang + "|" + (key || below || "");
    el.hidden = false;

    if (full !== barKey) {
      barKey = full;
      el.innerHTML = '<div class="bar__row">' +
          '<div class="bar__title">' +
            "<h1>" + esc(HEADING[view] ? t()[HEADING[view]] : t().title) + "</h1>" +
            (barSub ? '<span class="bar__sub">' + esc(barSub) + "</span>" : "") +
          "</div>" +
          langButton() +
        "</div>" + (below || "");
      /* First paint of a track: the thumb is placed, not animated. Sliding in
         from the left edge on arrival looks like a bug, not a flourish. */
      slide(el.querySelector(".seg"), false);
      measureChrome();
      return "";
    }

    /* Same header, different answer. The markup is left alone — rebuilding it
       is what would reset the thumb to its new home instantly — and only the
       pressed segment changes, which is the state the thumb animates towards.

       This is the whole reason the key is built from the segments a shop has
       rather than from the rendered HTML: the HTML carries aria-pressed, so
       keying on it made every tap look like a different header and took the
       instant path every time. */
    var track = el.querySelector(".seg");
    if (track) {
      var items = track.querySelectorAll("[data-filter]");
      for (var i = 0; i < items.length; i++) {
        var mine = items[i].getAttribute("data-filter") === filter;
        if (mine) items[i].setAttribute("aria-pressed", "true");
        else items[i].removeAttribute("aria-pressed");
      }
    }
    slide(track, true);
    measureChrome();
    return "";
  }

  /* How far down the list has to start. The header is fixed, so it is out of
     the flow and the list would otherwise begin underneath it — and its height
     is not a constant: Commandes carries a segmented control, the other three
     do not. Measured after each render, which is also what makes it survive a
     rotation or a font-size change. */
  function measureChrome() {
    var el = document.getElementById("topbar");
    if (!el || el.hidden) return;
    var h = Math.ceil(el.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--chrome-top", h + 8 + "px");
  }

  /**
   * The raised segment, as a thing that moves.
   *
   * A background that switches from one segment to another is instant and
   * tells the eye nothing about where the selection went. A thumb that
   * travels shows the relationship: it was there, it is here now, and the two
   * are the same control. That is the whole difference between a row of
   * buttons and a segmented control.
   *
   * Measured with getBoundingClientRect rather than offsetLeft: in a
   * right-to-left, horizontally scrollable track, offsetLeft is inconsistent
   * across browsers, while the difference between two rects is not. Adding
   * scrollLeft converts a viewport position back to a position in the track's
   * own content, which is what the thumb is placed against.
   */
  function slide(track, animate) {
    if (!track) return;
    var thumb = track.querySelector(".seg__thumb");
    var on = track.querySelector('[aria-pressed="true"]');
    if (!thumb || !on) return;

    var t = track.getBoundingClientRect();
    var a = on.getBoundingClientRect();
    if (!a.width) return;

    var x = a.left - t.left + track.scrollLeft;

    if (!animate) {
      thumb.style.transition = "none";
      thumb.style.width = a.width + "px";
      thumb.style.transform = "translateX(" + x + "px)";
      /* Force the browser to adopt the new position before transitions are
         allowed again, or re-enabling them animates from the old one. */
      void thumb.offsetWidth;
      thumb.style.transition = "";
      return;
    }

    thumb.style.width = a.width + "px";
    lens(thumb, x, thumb.getBoundingClientRect().left - t.left);
  }

  /**
   * The travelling part.
   *
   * A lens that slides at a fixed width is a rectangle that changed position.
   * A lens that stretches along its path and settles is one that has weight —
   * it is the difference between a selection that moved and a selection that
   * *travelled*, which is the whole thing being asked for here.
   *
   * The stretch is applied on the way and released a beat before the journey
   * ends, so the lens arrives already gathering itself rather than snapping
   * back after it has stopped. The dispersion ring is on for exactly that
   * window: glass only splits light while it is moving through it.
   */
  function lens(thumb, to, from) {
    var travel = Math.abs(to - from);
    if (travel < 2) {
      thumb.style.transform = "translateX(" + to + "px)";
      return;
    }

    /* Longer journeys stretch more, but never past a point where the lens
       stops looking like the thing it was. */
    var stretch = Math.min(1 + travel / 900, 1.14);

    thumb.classList.add("is-travelling");
    thumb.style.transform =
      "translateX(" + to + "px) scaleX(" + stretch + ")";

    clearTimeout(thumb._settle);
    thumb._settle = setTimeout(function () {
      thumb.style.transform = "translateX(" + to + "px)";
      thumb.classList.remove("is-travelling");
    }, 210);
  }

  /**
   * The shipping table.

   * Every wilaya is listed, including the ones with no row of their own: a
   * merchant cannot otherwise tell "costs nothing" from "never set", and those

   * the distinction stays visible.

  function renderRates(data) {

  /**
   * Sends the whole table, not just what was touched.
   *
   * A blank field means "use the shop default", so it is left out entirely
   * rather than sent as a zero — free delivery and unset are different things,
   * and zero is the one a careless save would write.
   */
  function saveRates(btn) {
    var rates = {};
    var bad = null;

    [].forEach.call(document.querySelectorAll(".rates tbody tr"), function (tr) {
      var h = tr.querySelector('[data-rate="home"]');
      var d = tr.querySelector('[data-rate="desk"]');
      if (h.value === "" && d.value === "") return;
      var hv = Number(h.value === "" ? h.placeholder : h.value);
      var dv = Number(d.value === "" ? d.placeholder : d.value);
      if (!isFinite(hv) || !isFinite(dv) || hv < 0 || dv < 0) {
        bad = bad || (h.value !== "" && (!isFinite(hv) || hv < 0) ? h : d);
        return;
      }
      rates[tr.dataset.code] = [Math.round(hv), Math.round(dv)];
    });

    if (bad) {
      bad.focus();
      bad.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }

    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = t().saving;

    api("/rates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rates: rates })
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function () {
        btn.textContent = t().saved;
        setTimeout(function () {
          btn.textContent = was;
          btn.disabled = false;
        }, 1400);
      })
      .catch(function () {
        btn.textContent = was;
        btn.disabled = false;
        alert(t().saveFail);
      });
  }

  /* ── Carriers ─────────────────────────────────────────────────────────
     Kept in a variable so changing the provider in the form can redraw the
     credential fields without a round trip — each provider asks for a
     different pair, and refetching to learn that would make the select feel
     broken. */
  var carrierData = null;
  var editing = null;   // carrier id being edited, or null for a new one
  var formOpen = false;

      (chosen === "MANUAL"

  var MENU_ICONS = {

    remove: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7l.8 12.1A1.5 1.5 0 0 0 8.8 20.5h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/></svg>',
  };

    return '<button class="kebab" type="button" data-menu="' + esc(id) + '" ' +

  /**
   * One menu element, moved and refilled rather than one per card.
   *
   * Fifty carriers would otherwise mean fifty hidden menus in the document,
   * all of them re-created on every render. There is only ever one open.
   */
  function openMenu(btn, id) {
    var el = document.getElementById("menu");
    var row = function (action, key, cls) {
      return '<button type="button" data-menu-do="' + action + '" ' +
        'data-menu-id="' + esc(id) + '"' + (cls ? ' class="' + cls + '"' : "") +
        ">" + MENU_ICONS[action] + "<span>" + esc(t()[key]) + "</span></button>";
    };

    el.innerHTML = row("test", "test") + row("edit", "edit") +
      "<hr>" + row("remove", "remove", "danger");
    el.hidden = false;

    /* Placed against the button that opened it, flipped to whichever side has
       room, and clamped so it never hangs off the screen. */
    var b = btn.getBoundingClientRect();
    /* offsetWidth, not getBoundingClientRect: the menu starts at scale(.86)
       so its rect is 14 % smaller than the box it will occupy, and placing it
       against that measurement pushed it off the edge of the screen the
       moment it finished growing. Layout sizes ignore transforms. */
    var mw = el.offsetWidth, mh = el.offsetHeight;
    var pad = 8;
    var left = Math.min(Math.max(pad, b.right - mw), innerWidth - mw - pad);
    var below = b.bottom + 6;
    var flip = below + mh > innerHeight - pad;
    el.style.left = left + "px";
    el.style.top = (flip ? b.top - mh - 6 : below) + "px";
    el.style.setProperty("--from",
      (b.left + b.width / 2 - left) + "px " + (flip ? "100%" : "0"));

    void el.offsetHeight;
    el.classList.add("is-open");
    menuOwner = btn;
  }

    el.classList.remove("is-open");

    }, 260);
  }

  function loadCarriers() {
