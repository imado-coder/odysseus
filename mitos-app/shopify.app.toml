# MITOS — cash-on-delivery commerce
# client_id is filled in by `shopify app config link`.

name = "MITOS COD"
handle = "mitos-cod"
application_url = "https://example.com"
embedded = true

[access_scopes]
# write_orders is what orderCreate needs. Customer name, phone and address are
# protected customer data — a public app needs Shopify's approval for that
# access, and approval is not instant.
scopes = "write_orders,read_orders,read_products"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

  # The three mandatory privacy topics. They are declared with
  # `compliance_topics` rather than `topics` — Shopify configures them per app
  # instead of subscribing them per shop, so they arrive even after the app has
  # been uninstalled, which is the whole point of shop/redact.
  #
  # All three land on the same receiver as everything else; the topic is in the
  # header. Handled in app/routes/webhooks.tsx, and what each one does is in
  # app/lib/gdpr.server.ts.
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
